<script>(function(){'use strict';var BASE='https://tcexzfztdgximrzuosqs.supabase.co',KEY='sb_publishable_8H8_S7NTWvzPCLvYUe2C4g_k3Ltjfiz',STORE='tg_session_v3',SBSTORE='sb-tcexzfztdgximrzuosqs-auth-token',PORTAL='techgeekph_admin_session';var session=null,profile=null,tickets=[],clients=[];var $=id=>document.getElementById(id),login=$('loginScreen'),shell=$('appShell');var EMP=[['app-attendance.html','⏱','Time In / Time Out','Attendance and breaks'],['app-tickets.html','✓','Technician Checklist','Assigned tickets and checklist'],['application_form.html?form=install','＋','New Installation','New client application'],['application_form.html?form=repair','🛠','Repair Form','Existing client repair'],['application_form.html?form=relocation','↔','Relocation Form','Existing client transfer'],['my_expense_request.html','₱','My Expenses','Expense requests'],['app-payslips.html','▥','Payslips','Payroll records']];var ADMIN=[['application_form.html','＋','Application Form','Installation, repair and relocation'],['clients.html','👥','Clients','Client master records'],['billing.html','₱','Billing Control','Billing and payments'],['tickets.html','🎫','Tickets Admin','Manage service tickets'],['nap-checker.html','◉','NAP Checker','NAP ports and clients'],['expense_approval.html','₱','Expense Approval','Review and approve staff expenses']];function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(v){return String(v||'').trim().toLowerCase()}function ticketStage(t){var s=norm(t.status);if(['done','resolved','closed','completed','cancelled','canceled'].includes(s))return'closed';if(['in progress','on going','ongoing','for checking','acknowledged','on the way','on site','diagnosing','for monitoring'].includes(s)||t.assigned_employee_id||String(t.assigned_tech||'').trim())return'progress';return'open'}function request(path,opt,auth){opt=opt||{};var h=Object.assign({'apikey':KEY,'Content-Type':'application/json'},opt.headers||{});if(auth!==false&&session&&session.access_token)h.Authorization='Bearer '+session.access_token;return fetch(BASE+path,Object.assign({},opt,{headers:h})).then(async r=>{var text=await r.text(),data=null;try{data=text?JSON.parse(text):null}catch(e){data=text}if(!r.ok)throw new Error(data&&data.message||'Request failed '+r.status);return{data:data,response:r}})}function saveSession(s){session=s;try{localStorage.setItem(STORE,JSON.stringify(s));localStorage.setItem(SBSTORE,JSON.stringify(s))}catch(e){}}function clearSession(){session=null;localStorage.removeItem(STORE);localStorage.removeItem(SBSTORE);localStorage.removeItem(PORTAL)}async function resolveLogin(id){if(id.includes('@'))return id;var o=await request('/rest/v1/rpc/resolve_app_login',{method:'POST',body:JSON.stringify({p_identifier:id})},false);if(!o.data)throw new Error('Account not found.');return String(o.data)}async function loadProfile(){var uid=session.user.id,o=await request('/rest/v1/staff_profiles?select=*&user_id=eq.'+encodeURIComponent(uid)+'&limit=1',{method:'GET'});profile=o.data&&o.data[0];if(!profile||!profile.active)throw new Error('Inactive account.')}function tile(x){return'<a class="tile" href="'+esc(x[0])+'" data-title="'+esc(x[2])+'"><span class="ico">'+x[1]+'</span><b>'+esc(x[2])+'</b><small>'+esc(x[3])+'</small></a>'}function renderMenu(){var list=profile.role==='EMPLOYEE'?EMP:ADMIN;$('menuGrid').innerHTML=$('allModulesGrid').innerHTML=list.map(tile).join('')}async function loadTickets(){try{var o=await request('/rest/v1/tech_ticket_public_queue?select=*&order=created_date.desc&limit=200',{method:'GET'});tickets=Array.isArray(o.data)?o.data:[]}catch(e){tickets=[]}renderTickets()}function renderTickets(){var box=$('ticketRecords');if(!tickets.length){box.innerHTML='<div class="empty">No tickets available.</div>';return}box.innerHTML=tickets.slice(0,50).map(function(t){var sg=ticketStage(t),unassigned=!t.assigned_employee_id&&!String(t.assigned_tech||'').trim(), dataset.claim));document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=function(){var d=document.getElementById('d-'+b.dataset.detail);var hide=d.style.display!=='none';d.style.display=hide?'none':'';b.textContent=hide?'Show Details':'Hide Details'})}async function claim(no){if(!confirm('Get this ticket and assign it to you?'))return;try{await request('/rest/v1/rpc/claim_my_ticket',{method:'POST',body:JSON.stringify({p_ticket_no:no})});await loadTickets()}catch(e){alert(e.message)}}function stat(x){return'<div class="stat"><span>'+x[0]+'</span><b>'+x[1]+'</b><small>'+x[2]+'</small></div>'}async function loadHome(){await loadTickets();if(profile.role==='EMPLOYEE'){$('stats').innerHTML=[['Open',tickets.filter(t=>ticketStage(t)==='open').length,'Team queue'],['My Tickets',tickets.filter(t=>String(t.assigned_employee_id||'')===String(profile.employee_id||'')).length,'Assigned to me'],['In Progress',tickets.filter(t=>ticketStage(t)==='progress').length,'Active'],['Closed',tickets.filter(t=>ticketStage(t)==='closed').length,'Completed']].map(stat).join('')}else{try{var o=await request('/rest/v1/clients?select=account_no,account_status&limit=1000',{method:'GET'});clients=o.data||[]}catch(e){}var active=clients.filter(x=>norm(x.account_status).startsWith('active')).length;$('stats').innerHTML=[['Total Clients',clients.length,'Client records'],['Active Clients',active,'Active accounts'],['Tickets',tickets.length,'Team queue'],['Role',profile.role,'Current access']].map(stat).join('')}}async function enter(s){session=s;await loadProfile();$('topName').textContent=profile.full_name;$('topRole').textContent=profile.role;$('welcomeName').textContent='Hello, '+profile.full_name.split(' ')[0];$('welcomeRole').textContent=profile.role;$('welcomeSub').textContent=profile.role==='EMPLOYEE'?'Your employee records and field service forms':'Full TechGeekPH operations access';renderMenu();login.classList.add('hidden');shell.classList.remove('hidden');loadHome()}function activate Msg').className='msg show error'}};$('showPw').onclick=()=>{$('password').type=$('password').type==='password'?'text':'password'};$('logoutBtn').onclick=()=>{clearSession();location.reload()};document.querySelectorAll('#bottomNav button').forEach(b=>b.onclick=()=>activate(b.dataset.panel));document.addEventListener('click',e=>{var a=e.target.closest('a.tile');if(!a)return;e.preventDefault();var href=a.getAttribute('href');$('moduleTitle').textContent=a.dataset.title;lockEmbeddedApplicationForm(href);$('moduleFrame').src=href+(href.includes('?')?'&':'?')+'embed=1&t='+Date.now();activate('modulePanel')});$('moduleFrame').addEventListener('load',function(){try{var w=this.contentWindow,d=this.contentDocument;if(!w||!d||!String(w.location.pathname).endsWith('/application_form.html'))return;if(d.getElementById('tg-client-sync-script'))return;var sc=d.createElement('script');sc.id='tg-client-sync-script';sc.src='assets/app-client-sync.js?v=20260823-field-save1';d.head.appendChild(sc)}catch(e){console.warn('Client sync injection failed',e)}});$('moduleBack').onclick=()=>activate('modulesPanel');(async()=>{try{var s=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(SBSTORE)||'null');if(s&&s.access_token)await enter(s)}catch(e){clearSession()}})();})();</script></body></html>
