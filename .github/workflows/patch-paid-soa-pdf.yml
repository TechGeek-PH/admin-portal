name: Patch paid SOA PDF download

on:
  push:
    paths:
      - '.github/workflows/patch-paid-soa-pdf.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add paid SOA PDF action to Billing
        run: python3 .github/scripts/patch_paid_soa_pdf.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add billing.html statement_of_account.html
          git commit -m 'Add one-click paid SOA PDF download' || exit 0
          git push
