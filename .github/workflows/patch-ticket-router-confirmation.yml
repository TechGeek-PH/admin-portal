name: Patch New Install Router Confirmation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ticket-router-confirmation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch technician new installation confirmation flow
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit patched ticket page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-tickets.html
          if ! git diff --cached --quiet; then
            git commit -m 'Add PPPoE router confirmation before closing new installs'
            git push
          fi
