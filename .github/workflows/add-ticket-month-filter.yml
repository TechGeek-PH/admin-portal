name: Add Ticket Month Filter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add monthly filters to admin and technician tickets
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          # Admin tickets
          p = Path('tickets.html')
          s = p.read_text(encoding='utf-8')

          s = replace_once(
              s,
              '.toolbar{display:grid;grid-template-columns:minmax(250px,1.4fr) repeat(3,minmax(150px,.6fr)) auto;',
              '.toolbar{display:grid;grid-template-columns:minmax(250px,1.4fr) repeat(4,minmax(145px,.6fr)) auto;',
              'admin toolbar css'
          )
          s = replace_once(
              s,
              '<div class="toolbar"><input class="ctl" id="search" placeholder="Search ticket, client, concern, tech"><select class="ctl" id="catFilter">',
              '<div class="toolbar"><input class="ctl" id="search" placeholder="Search ticket, client, concern, tech"><select class="ctl" id="monthFilter"><option value="">All Months</option></select><select class="ctl" id="catFilter">',
              'admin month select'
          )
          s = replace_once(
              s,
              "function statusPill(v){const s=n(v),c=['resolved','completed','done'].includes(s)?'done':s.includes('waiting')||s==='for reschedule'?'warn':s.includes('cancel')?'bad':'';return '<span class=\"pill '+c+'\">'+esc(v||'New')+'</span>'}",
              "function statusPill(v){const s=n(v),c=['resolved','completed','done'].includes(s)?'done':s.includes('waiting')||s==='for reschedule'?'warn':s.includes('cancel')?'bad':'';return '<span class=\"pill '+c+'\">'+esc(v||'New')+'</span>'}\nfunction ticketMonth(r){const k=String(r&&r.created_date||'').slice(0,7);return /^\\d{4}-\\d{2}$/.test(k)?k:''}\nfunction monthLabel(k){const a=String(k||'').split('-').map(Number);return a.length===2&&a[0]&&a[1]?new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric'}).format(new Date(a[0],a[1]-1,1)):k}\nfunction populateMonthFilter(){const el=$('#monthFilter');if(!el)return;const old=el.value,months=[...new Set(tickets.map(ticketMonth).filter(Boolean))].sort().reverse(),current=new Date().toISOString().slice(0,7);el.innerHTML='<option value=\"\">All Months</option>'+months.map(k=>'<option value=\"'+esc(k)+'\">'+esc(monthLabel(k))+'</option>').join('');el.value=months.includes(old)?old:(months.includes(current)?current:'')}",
              'admin month helpers'
          )
          old_render = "function render(){const q=n($('#search').value),cf=$('#catFilter').value,sf=$('#statusFilter').value,pf=$('#priorityFilter').value;const open=tickets.filter(r=>!isClosed(r)),closed=tickets.filter(isClosed);const filtered=open.filter(raw=>{const r=derive(raw),hay=n([r.ticket_no,r.client_name,r.client_account_no,r.category,r.concern,r.issue_purpose,r.assigned_tech,r.status].join(' '));return(!q||hay.includes(q))&&(!cf||r.category===cf)&&(!sf||r.status===sf)&&(!pf||r.priority===pf)});$('#mTotal').textContent=tickets.length;$('#mOpen').textContent=open.length;$('#mProgress').textContent=tickets.filter(isProgress).length;$('#mDone').textContent=tickets.filter(r=>['resolved','completed','done'].includes(n(r.status))).length;$('#mUrgent').textContent=tickets.filter(r=>['urgent','critical'].includes(n(r.priority))).length;$('#activeRows').innerHTML=filtered.length?filtered.map(rowHtml).join(''):'<tr><td colspan=\"11\" class=\"empty\">No matching open tickets.</td></tr>';$('#closedRows').innerHTML=closed.length?closed.map(rowHtml).join(''):'<tr><td colspan=\"11\" class=\"empty\">No resolved/completed tickets yet.</td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(Number(b.dataset.edit)));document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyTicket(Number(b.dataset.copy)))}"
          new_render = "function render(){const q=n($('#search').value),mf=$('#monthFilter').value,cf=$('#catFilter').value,sf=$('#statusFilter').value,pf=$('#priorityFilter').value,scoped=tickets.filter(r=>!mf||ticketMonth(r)===mf);const open=scoped.filter(r=>!isClosed(r)),closed=scoped.filter(isClosed);const filtered=open.filter(raw=>{const r=derive(raw),hay=n([r.ticket_no,r.client_name,r.client_account_no,r.category,r.concern,r.issue_purpose,r.assigned_tech,r.status].join(' '));return(!q||hay.includes(q))&&(!cf||r.category===cf)&&(!sf||r.status===sf)&&(!pf||r.priority===pf)});$('#mTotal').textContent=scoped.length;$('#mOpen').textContent=open.length;$('#mProgress').textContent=scoped.filter(isProgress).length;$('#mDone').textContent=scoped.filter(r=>['resolved','completed','done'].includes(n(r.status))).length;$('#mUrgent').textContent=scoped.filter(r=>['urgent','critical'].includes(n(r.priority))).length;$('#activeRows').innerHTML=filtered.length?filtered.map(rowHtml).join(''):'<tr><td colspan=\"11\" class=\"empty\">No matching open tickets for this month.</td></tr>';$('#closedRows').innerHTML=closed.length?closed.map(rowHtml).join(''):'<tr><td colspan=\"11\" class=\"empty\">No resolved/completed tickets for this month.</td></tr>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(Number(b.dataset.edit)));document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyTicket(Number(b.dataset.copy)))}"
          s = replace_once(s, old_render, new_render, 'admin render')
          s = replace_once(
              s,
              "tickets=t.data||[];clients=c.data||[];$('#clientList').innerHTML=",
              "tickets=t.data||[];clients=c.data||[];populateMonthFilter();$('#clientList').innerHTML=",
              'admin populate month'
          )
          s = replace_once(
              s,
              "['catFilter','statusFilter','priorityFilter'].forEach(id=>$('#'+id).onchange=render);$('#clearFilters').onclick=()=>{$('#search').value='';$('#catFilter').value='';$('#statusFilter').value='';$('#priorityFilter').value='';render()}",
              "['monthFilter','catFilter','statusFilter','priorityFilter'].forEach(id=>$('#'+id).onchange=render);$('#clearFilters').onclick=()=>{$('#search').value='';$('#monthFilter').value='';$('#catFilter').value='';$('#statusFilter').value='';$('#priorityFilter').value='';render()}",
              'admin filter handlers'
          )
          p.write_text(s, encoding='utf-8')

          # Technician tickets
          q = Path('app-tickets.html')
          t = q.read_text(encoding='utf-8')
          t = replace_once(
              t,
              '.bar{display:grid;grid-template-columns:1fr 150px;gap:9px;margin-top:12px}',
              '.bar{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.bar input{grid-column:1/-1}',
              'tech bar css mobile'
          )
          t = replace_once(
              t,
              '@media(min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.bar{grid-template-columns:1fr 190px}.meta{grid-template-columns:repeat(4,1fr)}}',
              '@media(min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.bar{grid-template-columns:1fr 190px 190px}.bar input{grid-column:auto}.meta{grid-template-columns:repeat(4,1fr)}}',
              'tech bar css desktop'
          )
          t = replace_once(
              t,
              '<div class="bar"><input id="q" placeholder="Search ticket / client / issue"><select id="status">',
              '<div class="bar"><input id="q" placeholder="Search ticket / client / issue"><select id="month"><option value="">All Months</option></select><select id="status">',
              'tech month select'
          )
          t = replace_once(
              t,
              "function stageLabel(s){return s==='closed'?'CLOSED':s==='progress'?'IN PROGRESS':'OPEN'}",
              "function stageLabel(s){return s==='closed'?'CLOSED':s==='progress'?'IN PROGRESS':'OPEN'}\nfunction ticketMonth(t){const k=String(t&&t.created_date||'').slice(0,7);return /^\\d{4}-\\d{2}$/.test(k)?k:''}\nfunction monthLabel(k){const a=String(k||'').split('-').map(Number);return a.length===2&&a[0]&&a[1]?new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric'}).format(new Date(a[0],a[1]-1,1)):k}\nfunction populateMonthFilter(){const el=$('month'),old=el.value,months=[...new Set(tickets.map(ticketMonth).filter(Boolean))].sort().reverse(),current=new Date().toISOString().slice(0,7);el.innerHTML='<option value=\"\">All Months</option>'+months.map(k=>'<option value=\"'+esc(k)+'\">'+esc(monthLabel(k))+'</option>').join('');el.value=months.includes(old)?old:(months.includes(current)?current:'')}",
              'tech month helpers'
          )
          t = replace_once(
              t,
              "tickets=all;updates=new Map((ur.data||[]).map(x=>[x.ticket_no,x]));const closed=tickets.filter(t=>stage(t,updates.get(t.ticket_no)||{})==='closed').length;$('assigned').textContent=tickets.length;$('closed').textContent=closed;$('active').textContent=Math.max(0,tickets.length-closed);render();",
              "tickets=all;updates=new Map((ur.data||[]).map(x=>[x.ticket_no,x]));populateMonthFilter();render();",
              'tech load stats'
          )
          old_tech_render = "function render(){const q=$('q').value.trim().toLowerCase(),st=$('status').value;const list=tickets.filter(t=>{const u=updates.get(t.ticket_no)||{},sg=stage(t,u),hay=[t.ticket_no,t.client_name,t.client_account_no,t.issue_purpose,t.concern,t.assigned_tech,t.address,t.tech_remarks,u.remarks].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!st||sg===st)});$('grid').innerHTML=list.length?"
          new_tech_render = "function render(){const q=$('q').value.trim().toLowerCase(),mo=$('month').value,st=$('status').value,scoped=tickets.filter(t=>!mo||ticketMonth(t)===mo),closedCount=scoped.filter(t=>stage(t,updates.get(t.ticket_no)||{})==='closed').length;const list=scoped.filter(t=>{const u=updates.get(t.ticket_no)||{},sg=stage(t,u),hay=[t.ticket_no,t.client_name,t.client_account_no,t.issue_purpose,t.concern,t.assigned_tech,t.address,t.tech_remarks,u.remarks].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!st||sg===st)});$('assigned').textContent=scoped.length;$('closed').textContent=closedCount;$('active').textContent=Math.max(0,scoped.length-closedCount);$('grid').innerHTML=list.length?"
          t = replace_once(t, old_tech_render, new_tech_render, 'tech render')
          t = replace_once(
              t,
              "$('q').oninput=render;$('status').onchange=render;",
              "$('q').oninput=render;$('month').onchange=render;$('status').onchange=render;",
              'tech filter handlers'
          )
          t = t.replace("const BUILD='20260901-ticket-maps-v10'", "const BUILD='20260901-ticket-months-v11'", 1)
          q.write_text(t, encoding='utf-8')
          print('Monthly ticket filters patched.')
          PY

      - name: Syntax-check inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for src, out in [('tickets.html','/tmp/tickets-inline.js'),('app-tickets.html','/tmp/app-tickets-inline.js')]:
              text=Path(src).read_text(encoding='utf-8')
              blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
              inline=[b for b in blocks if b.strip()]
              if not inline:
                  raise SystemExit(f'No inline script found in {src}')
              Path(out).write_text(inline[-1], encoding='utf-8')
          PY
          node --check /tmp/tickets-inline.js
          node --check /tmp/app-tickets-inline.js

      - name: Commit monthly ticket filters
        run: |
          if git diff --quiet -- tickets.html app-tickets.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tickets.html app-tickets.html
          git commit -m "Add monthly ticket filters"
          git pull --rebase origin main
          git push
