name: Patch Client Dashboard Links

on:
  push:
    paths:
      - '.github/workflows/patch-client-dashboard-links.yml'
      - 'scripts/patch_client_multi_account.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure client self-service profile editor
        run: python3 .github/scripts/patch_client_self_profile.py
      - name: Add client multi-account switcher
        run: python3 scripts/patch_client_multi_account.py
      - name: Commit client portal updates
        run: |
          if git diff --quiet -- client/index.html client/app.js; then
            echo "Already patched."
            exit 0
          fi
          git config user.name "TechGeekPH"
          git config user.email "137922253+TechGeek-PH@users.noreply.github.com"
          git add client/index.html client/app.js
          git commit -m "Add linked account switcher to Client Portal"
          git push
