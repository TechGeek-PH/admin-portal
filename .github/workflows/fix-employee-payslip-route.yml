name: Fix employee payslip route

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-employee-payslip-route.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point employee Payslips directly to new GUI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.html')
          s = p.read_text(encoding='utf-8')
          old = "['payslip_generator.html','▥','Payslips','Payroll records']"
          new = "['app-payslips.html','▥','Payslips','Payroll records']"
          if old not in s:
              raise SystemExit('Expected employee payslip route not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit route fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          git rm .github/workflows/fix-employee-payslip-route.yml
          git commit -m "Route employee payslips directly to new GUI [skip ci]"
          git push origin HEAD:main
