name: Patch Ticket Maps

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Maps fields to ticketing
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tickets.html')
          s = p.read_text(encoding='utf-8')
          old = s

          s = s.replace(
            '<div class="field w2"><label>Service Address / Location</label><input class="ctl" id="address"></div><div class="client-preview" id="clientPreview">',
            '<div class="field w2"><label>Service Address / Location</label><input class="ctl" id="address"></div><div class="field w2"><label>Google Maps Link / Client Pin</label><input class="ctl" id="mapsLink" type="url" inputmode="url" placeholder="https://maps.app.goo.gl/... or Google Maps shared link"><small>Recommended for New Installation so the assigned technician can open the exact client pin.</small></div><div class="client-preview" id="clientPreview">'
          )

          s = s.replace(
            '<div class="field"><label>Schedule Date</label><input class="ctl" id="eSchedule" type="date"></div><div class="field full"><label>Concern Description / Work Instruction</label>',
            '<div class="field"><label>Schedule Date</label><input class="ctl" id="eSchedule" type="date"></div><div class="field full"><label>Google Maps Link / Client Pin</label><input class="ctl" id="eMaps" type="url" inputmode="url" placeholder="https://maps.app.goo.gl/... or Google Maps shared link"><small>For installations, paste the exact client location pin. Assigned technicians will see an Open Maps button.</small></div><div class="field full"><label>Concern Description / Work Instruction</label>'
          )

          s = s.replace(
            "$('#address').value=selectedClient.service_address||'';$('#clientPreview').innerHTML=",
            "$('#address').value=selectedClient.service_address||'';$('#mapsLink').value=selectedClient.google_maps_link||'';$('#clientPreview').innerHTML="
          )

          s = s.replace(
            "address:$('#address').value.trim()||null,category,",
            "address:$('#address').value.trim()||null,google_maps_link:$('#mapsLink').value.trim()||null,category,"
          )

          s = s.replace(
            "$('#eSchedule').value=editing.schedule_date||'';$('#eDescription').value=",
            "$('#eSchedule').value=editing.schedule_date||'';$('#eMaps').value=editing.google_maps_link||'';$('#eDescription').value="
          )

          s = s.replace(
            "schedule_date:$('#eSchedule').value||null,issue_purpose:",
            "schedule_date:$('#eSchedule').value||null,google_maps_link:$('#eMaps').value.trim()||null,issue_purpose:"
          )

          s = s.replace(
            "'Address: '+(r.address||'—'),'Category: '",
            "'Address: '+(r.address||'—'),'Maps: '+(r.google_maps_link||'—'),'Category: '"
          )

          s = s.replace(
            "<button class=\"small\" data-edit=\"'+esc(r.id)+'\">Update</button><button class=\"small\" data-copy=\"'+esc(r.id)+'\">Copy</button>",
            "<button class=\"small\" data-edit=\"'+esc(r.id)+'\">Update</button>"+"+(maps?'<a class=\"small maplink\" target=\"_blank\" rel=\"noopener\" href=\"'+esc(maps)+'\">Map</a>':'')+"+"<button class=\"small\" data-copy=\"'+esc(r.id)+'\">Copy</button>"
          )

          s = s.replace(
            '.small{min-height:30px;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--blue);font-size:.62rem;font-weight:900}',
            '.small{min-height:30px;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--blue);font-size:.62rem;font-weight:900}.small.maplink{display:inline-flex;align-items:center;text-decoration:none;border-color:#8fc1e8;background:#eef7ff;color:#075cb5}'
          )

          s = s.replace(
            '<header class="topbar"><div><h1>Tickets</h1><p>Full IT service ticketing and technician workflow.</p></div>',
            '<header class="topbar"><div><h1>Tickets</h1><p>Full IT service ticketing, technician workflow, and client location pinning.</p></div>'
          )

          if s != old:
            p.write_text(s, encoding='utf-8')
            print('Patched tickets.html')
          else:
            print('tickets.html already patched or markers changed')

          q = Path('app-tickets.html')
          t = q.read_text(encoding='utf-8')
          t2 = t.replace("const BUILD='20260831-team-ticket-v9'", "const BUILD='20260901-ticket-maps-v10'")
          if t2 != t:
            q.write_text(t2, encoding='utf-8')
            print('Bumped technician ticket build')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- tickets.html app-tickets.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tickets.html app-tickets.html
          git commit -m "Add Google Maps pin to ticketing v10"
          git push
