name: Patch Team Ticket Duty

on:
  push:
    paths:
      - '.github/workflows/patch-team-ticket-duty.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_team_ticket.py
      - name: Commit changes
        run: |
          git config user.name "TechGeekPH Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app.html app-tickets.html
          git diff --cached --quiet || git commit -m "Enable team ticket assignment and duty modules"
          git push
