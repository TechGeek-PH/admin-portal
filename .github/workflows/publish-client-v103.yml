name: Publish TechGeekPH Client v1.0.3

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-client-v103.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed v1.0.3 release artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-1160-81f5-af9b-8e1cdfaeb97c/raw?se=2026-09-17T14%3A13%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=8fecaad4-ff04-5212-8c1b-468a2fb3c351&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T23%3A23%3A29Z&ske=2026-09-17T23%3A23%3A29Z&sks=b&skv=2026-02-06&sig=9aVEfR7zqoEae2H39Xhe4Wr5oNVtQnlrA%2BlsJC7Ve/c%3D' -o /tmp/techgeekph-v103.zip
          rm -rf /tmp/techgeekph-v103
          mkdir -p /tmp/techgeekph-v103 downloads
          unzip -q /tmp/techgeekph-v103.zip -d /tmp/techgeekph-v103
          APK=$(find /tmp/techgeekph-v103 -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" downloads/TechGeekPH-Client-v1.0.3.apk
          test "$(stat -c%s downloads/TechGeekPH-Client-v1.0.3.apk)" -gt 500000
          echo 'b3075e8e2f31bba4340c9cd8fae0622365d0db9488d005cfc9c14686fa2385ac  downloads/TechGeekPH-Client-v1.0.3.apk' | sha256sum -c -

      - name: Publish APK to public downloads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/TechGeekPH-Client-v1.0.3.apk
          if git diff --cached --quiet; then
            echo 'APK already published.'
            exit 0
          fi
          git commit -m 'Publish TechGeekPH Client v1.0.3 APK [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
