name: Add Collections Module

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app module lists
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.html')
          s = p.read_text(encoding='utf-8')
          if "'Collections','Collection list, field status updates and notes'" in s:
              print('Collections already present')
              raise SystemExit(0)
          old_emp = "['app-tickets.html','✓','Technician Tickets','Installation, repair, relocation and assigned service updates'],['nap-checker-employee.html'"
          new_emp = "['app-tickets.html','✓','Technician Tickets','Installation, repair, relocation and assigned service updates'],['collections.html','₱','Collections','Collection list, field status updates and notes'],['nap-checker-employee.html'"
          old_admin = "['billing.html','₱','Billing Control','Billing and payments'],['statement_of_account.html'"
          new_admin = "['billing.html','₱','Billing Control','Billing and payments'],['collections.html','₱','Collections','Collection list, field status updates and notes'],['statement_of_account.html'"
          if old_emp not in s:
              raise SystemExit('EMP module marker not found')
          if old_admin not in s:
              raise SystemExit('ADMIN module marker not found')
          s = s.replace(old_emp, new_emp, 1).replace(old_admin, new_admin, 1)
          s = s.replace("const BUILD='20260831-team-picker-v13';", "const BUILD='20260901-collections-v14';", 1)
          p.write_text(s, encoding='utf-8')
          print('Patched app.html')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- app.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          git commit -m "Add Collections to installer app"
          git push
