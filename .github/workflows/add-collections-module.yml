name: Add Collections Module

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app and Collections UI
        run: |
          python - <<'PY'
          from pathlib import Path

          # Keep Collections available in the installer/admin module list.
          p = Path('app.html')
          s = p.read_text(encoding='utf-8')
          changed_app = False
          if "'Collections','Collection list, field status updates and notes'" not in s:
              old_emp = "['app-tickets.html','✓','Technician Tickets','Installation, repair, relocation and assigned service updates'],['nap-checker-employee.html'"
              new_emp = "['app-tickets.html','✓','Technician Tickets','Installation, repair, relocation and assigned service updates'],['collections.html','₱','Collections','Collection list, field status updates and notes'],['nap-checker-employee.html'"
              old_admin = "['billing.html','₱','Billing Control','Billing and payments'],['statement_of_account.html'"
              new_admin = "['billing.html','₱','Billing Control','Billing and payments'],['collections.html','₱','Collections','Collection list, field status updates and notes'],['statement_of_account.html'"
              if old_emp in s and old_admin in s:
                  s = s.replace(old_emp, new_emp, 1).replace(old_admin, new_admin, 1)
                  changed_app = True
          if "const BUILD='20260831-team-picker-v13';" in s:
              s = s.replace("const BUILD='20260831-team-picker-v13';", "const BUILD='20260901-collections-v14';", 1)
              changed_app = True
          if changed_app:
              p.write_text(s, encoding='utf-8')

          # Collections UI: one collection Status filter only; Billing stays hidden.
          c = Path('collections.html')
          t = c.read_text(encoding='utf-8')
          old = t
          t = t.replace(
              'grid-template-columns:minmax(260px,1fr) 180px 180px 180px auto',
              'grid-template-columns:1fr 190px 190px auto'
          )
          t = t.replace('@media(max-width:1050px){.toolbar{grid-template-columns:1fr 1fr 1fr}}', '')
          t = t.replace(
              '<div class="field"><label>Collection Status</label><select id="status"><option value="">All statuses</option></select></div>\n    <div class="field"><label>Billing Status</label><select id="billing"><option value="">All billing</option><option value="UNPAID">Unpaid</option><option value="PAID">Paid</option></select></div>',
              '<div class="field"><label>Status</label><select id="status"><option value="">All statuses</option></select></div>'
          )
          t = t.replace('<th>Collection</th><th>Billing</th><th>Tech / Update</th>', '<th>Collection</th><th>Tech / Update</th>')
          t = t.replace('colspan="8"', 'colspan="7"')
          t = t.replace("+'<td>'+badge(r.billing_status)+'</td><td>'+esc(r.tech_name", "+'<td>'+esc(r.tech_name")
          t = t.replace("+'<b>Billing</b><span>'+badge(r.billing_status)+'</span><b>Tech</b><span>'+esc(r.tech_name", "+'<b>Tech</b><span>'+esc(r.tech_name")
          t = t.replace("+' · Billing: '+esc(r.billing_status||'—')", "")
          old_render = "function renderStatuses(){const v=$('status').value;$('status').innerHTML='<option value=\"\">All statuses</option>';state.statuses.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;if(s===v)o.selected=true;$('status').appendChild(o)})}"
          new_render = "function renderStatuses(){const v=$('status').value;const actual=state.rows.map(r=>String(r.collection_status||'').trim()).filter(Boolean);state.statuses=[...new Set([...(state.statuses||[]),...actual])];$('status').innerHTML='<option value=\"\">All statuses</option>';state.statuses.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;if(s===v)o.selected=true;$('status').appendChild(o)})}"
          t = t.replace(old_render, new_render)
          old_apply = "function apply(){const q=$('search').value.trim().toLowerCase(),sf=$('status').value,bf=$('billing').value.trim().toLowerCase();state.filtered=state.rows.filter(r=>(!sf||r.collection_status===sf)&&(!bf||String(r.billing_status||'').trim().toLowerCase()===bf)&&(!q||[r.account,r.client_name,r.phone,r.account_no,r.address,r.tech_name,r.collection_status,r.billing_status,r.note].join(' ').toLowerCase().includes(q)));"
          new_apply = "function apply(){const q=$('search').value.trim().toLowerCase(),sf=$('status').value;state.filtered=state.rows.filter(r=>(!sf||r.collection_status===sf)&&(!q||[r.account,r.client_name,r.phone,r.account_no,r.address,r.tech_name,r.collection_status,r.billing_status,r.note].join(' ').toLowerCase().includes(q)));"
          t = t.replace(old_apply, new_apply)
          t = t.replace("$('billing').onchange=apply;", '')

          # Deterministic month loading for both OWNER and EMPLOYEE sessions.
          old_load = "async function load(keep){clearNotice();$('refresh').disabled=true;try{if(!state.token)state.token=loadToken();const md=await api({action:'months'});state.months=Array.isArray(md.months)?md.months:[];renderMonths(keep?$('month').value:'');const requested=keep?$('month').value:'';const d=await api({action:'list',sheet:requested});state.rows=Array.isArray(d.rows)?d.rows:[];state.statuses=Array.isArray(d.statuses)?d.statuses:[];state.sheet=d.sheet||requested;if(Array.isArray(d.available_sheets)){state.months=d.available_sheets;renderMonths(state.sheet)}renderStatuses();apply();$('title').textContent='Collection List — '+((state.months.find(x=>x.sheet===state.sheet)||{}).label||state.sheet||'Current');$('meta').textContent=' · '+state.rows.length+' records · '+new Date().toLocaleTimeString();$('staff').textContent='Authenticated staff session'}catch(e){state.rows=[];apply();notice(String(e.message||e),'err')}finally{$('refresh').disabled=false}}"
          new_load = "async function load(keep){clearNotice();$('refresh').disabled=true;try{if(!state.token)state.token=loadToken();const previous=keep?$('month').value:'';const md=await api({action:'months'});state.months=Array.isArray(md.months)?md.months:[];if(!state.months.length)throw new Error('No collection month is available.');const currentKey=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit'}).slice(0,7);let chosen=previous&&state.months.some(m=>m.sheet===previous)?previous:'';if(!chosen){const eligible=state.months.filter(m=>String(m.period_key||'')<=currentKey);chosen=(eligible.length?eligible[eligible.length-1]:state.months[state.months.length-1]).sheet}renderMonths(chosen);let d=await api({action:'list',sheet:chosen});if((!Array.isArray(d.rows)||!d.sheet)&&chosen){d=await api({action:'list',sheet:chosen})}state.rows=Array.isArray(d.rows)?d.rows:[];state.statuses=Array.isArray(d.statuses)?d.statuses:[];state.sheet=d.sheet||chosen;if(Array.isArray(d.available_sheets)&&d.available_sheets.length){state.months=d.available_sheets}renderMonths(state.sheet);renderStatuses();apply();$('title').textContent='Collection List — '+((state.months.find(x=>x.sheet===state.sheet)||{}).label||state.sheet||'Current');$('meta').textContent=' · '+state.rows.length+' records · '+new Date().toLocaleTimeString();$('staff').textContent='Authenticated staff session'}catch(e){state.rows=[];state.sheet='';apply();notice(String(e.message||e),'err')}finally{$('refresh').disabled=false}}"
          t = t.replace(old_load, new_load)

          if t != old:
              c.write_text(t, encoding='utf-8')
              print('Patched collections.html')
          else:
              print('Collections UI already in desired state')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- app.html collections.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html collections.html
          git commit -m "Fix employee Collections month loading"
          git push
