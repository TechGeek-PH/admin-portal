name: Add Admin NAP per-port dBm readings

on:
  push:
    paths:
      - '.github/workflows/add-admin-nap-port-dbm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Admin NAP per-port dBm
        run: python .github/scripts/add_admin_nap_port_dbm.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "TechGeekPH Bot"
          git config user.email "137922253+TechGeek-PH@users.noreply.github.com"
          git add nap-checker-v2.html nap-checker.html
          git commit -m "Show live dBm reading on Admin NAP port blocks"
          git push
