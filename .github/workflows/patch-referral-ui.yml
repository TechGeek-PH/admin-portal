name: Patch Referral Commission UI

on:
  push:
    paths:
      - '.github/workflows/patch-referral-ui.yml'
      - '.github/scripts/patch_referral_ui.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply referral patch
        run: python .github/scripts/patch_referral_ui.py
      - name: Commit changes
        run: |
          git config user.name "TechGeekPH Automation"
          git config user.email "actions@users.noreply.github.com"
          git add tickets.html
          git diff --cached --quiet || git commit -m "Add referral commission selection to new installations"
          git push
