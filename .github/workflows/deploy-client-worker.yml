name: Deploy Client Worker

on:
  push:
    paths:
      - 'cloudflare-client-worker.js'
      - 'wrangler-client.toml'
      - '.github/workflows/deploy-client-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Cloudflare token
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'No Cloudflare API token secret is configured.'
            exit 2
          fi
      - name: Resolve account ID when needed
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            ACCOUNT_ID=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('result') or [{}])[0].get('id',''))")
            if [ -z "$ACCOUNT_ID" ]; then
              echo 'Unable to resolve Cloudflare account ID.'
              exit 3
            fi
            echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          fi
      - name: Deploy techgeekph-client
        run: npx wrangler@latest deploy --config wrangler-client.toml
