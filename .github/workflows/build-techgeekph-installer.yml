name: Build TechGeekPH APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-techgeekph-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: techgeekph-android-apk
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p mobile/android clean assembleDebug --stacktrace

      - name: Prepare public APK
        run: |
          mkdir -p downloads
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk downloads/TechGeekPH.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TechGeekPH
          path: downloads/TechGeekPH.apk

      - name: Publish APK to GitHub Pages repository
        run: |
          cp downloads/TechGeekPH.apk /tmp/TechGeekPH.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p downloads
          cp /tmp/TechGeekPH.apk downloads/TechGeekPH.apk
          git add downloads/TechGeekPH.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish latest TechGeekPH APK [skip ci]"
            git push origin HEAD:main
          fi
