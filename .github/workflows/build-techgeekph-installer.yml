name: Build TechGeekPH Installer APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-techgeekph-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p mobile/android clean assembleDebug --stacktrace

      - name: Prepare public APK
        run: |
          mkdir -p downloads
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk downloads/TechGeekPH-Installer.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TechGeekPH-Installer
          path: downloads/TechGeekPH-Installer.apk

      - name: Publish APK to GitHub Pages repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add downloads/TechGeekPH-Installer.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Publish latest TechGeekPH Installer APK [skip ci]"
            git push
          fi
