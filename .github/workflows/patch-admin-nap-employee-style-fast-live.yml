name: Patch Admin NAP employee style + fast live checks

on:
  push:
    paths:
      - '.github/workflows/patch-admin-nap-employee-style-fast-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Admin NAP UI and live checks
        run: python .github/scripts/patch_admin_nap_employee_style.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "TechGeekPH Bot"
          git config user.email "137922253+TechGeek-PH@users.noreply.github.com"
          git add nap-checker-v2.html nap-checker.html ops/network-monitor-agent.py ops/install-network-monitor.sh
          git commit -m "Match Admin NAP UI to Employee and speed live checks"
          git push
