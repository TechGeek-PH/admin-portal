name: Verify MikroTik Ping Monitor
on:
  pull_request:
    paths:
      - 'ops/mikrotik-pppoe-ping-edge.py'
      - 'tests/test_pppoe_ping_edge.py'
      - '.github/workflows/verify-pppoe-ping-monitor.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile agent
        run: python -m py_compile ops/mikrotik-pppoe-ping-edge.py
      - name: Run regression tests (no network, no router credentials)
        run: python -m unittest discover -s tests -p test_pppoe_ping_edge.py -v
