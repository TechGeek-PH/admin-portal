name: Add Client Self Profile

on:
  push:
    paths:
      - '.github/workflows/add-client-self-profile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Client Dashboard
        run: python3 .github/scripts/patch_client_self_profile.py
      - name: Commit changes
        run: |
          if git diff --quiet -- client/index.html client/app.js; then
            echo "Already patched."
            exit 0
          fi
          git config user.name "TechGeekPH"
          git config user.email "137922253+TechGeek-PH@users.noreply.github.com"
          git add client/index.html client/app.js
          git commit -m "Add client self-service personal profile editor"
          git push
