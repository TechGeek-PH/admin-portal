name: Patch Ticket PPPoE Auto Provisioning

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-pppoe-auto-ticket.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch technician ticket PPPoE automation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app-tickets.html')
          s=p.read_text()

          s=s.replace("const BUILD='20260901-ticket-months-v11'","const BUILD='20260901-pppoe-auto-v12'",1)

          old="function setClientReadonly(ro,t,d){clientFieldIds.forEach(id=>$(id).readOnly=ro);if(!ro&&!isInstallation(t)&&d&&d.existing_client)$('cuAccount').readOnly=true}"
          new="function setClientReadonly(ro,t,d){clientFieldIds.forEach(id=>$(id).readOnly=ro);const install=isInstallation(t);if(!ro&&install){$('cuAccount').readOnly=true;$('cuRemoteAddress').readOnly=true}if(!ro&&!install&&d&&d.existing_client)$('cuAccount').readOnly=true}"
          if old not in s:
              raise SystemExit('setClientReadonly target not found')
          s=s.replace(old,new,1)

          old_note="$('clientRequired').textContent=isInstallation(t)?'Required before closing: Account No., Client Name, Service Address, Plan and Speed. Other fields should be completed whenever available.':isRelocation(t)?'Before closing, confirm the NEW Service Address and update Maps/NAP/ports if they changed.':'Update only the details that changed during repair; existing values are preserved.';"
          new_note="$('cuAccount').placeholder=isInstallation(t)?'AUTO — next available account':'SATR0000';$('cuRemoteAddress').placeholder=isInstallation(t)?'AUTO — next unused 104.98.10.2–104.98.255.254':'';$('clientRequired').textContent=isInstallation(t)?'AUTO: Account No., PPPoE Username, PPPoE Password and Remote Address. Required before closing: Client Name, Service Address, Plan and Speed. LP / NP / CP are used to build the MikroTik PPP Secret comment.':isRelocation(t)?'Before closing, confirm the NEW Service Address and update Maps/NAP/ports if they changed.':'Update only the details that changed during repair; existing values are preserved.';"
          if old_note not in s:
              raise SystemExit('clientRequired target not found')
          s=s.replace(old_note,new_note,1)

          old_rpc="db.rpc('save_technician_ticket_update_v2'"
          if old_rpc not in s:
              raise SystemExit('save RPC target not found')
          s=s.replace(old_rpc,"db.rpc('save_technician_ticket_update_v3'",1)

          old_success="await load();note((result.client_updated?'Client master + ':'')+'ticket update saved successfully.','ok')"
          new_success="await load();const pppoe=result.pppoe_status?' · PPPoE '+result.pppoe_status:'';const acct=result.account_no?' · '+result.account_no:'';note((result.client_updated?'Client master + ':'')+'ticket update saved successfully'+acct+pppoe+'.','ok')"
          if old_success not in s:
              raise SystemExit('success message target not found')
          s=s.replace(old_success,new_success,1)

          s=s.replace('New installations must also have Account No., Client Name, Service Address, Plan and Speed.','New installations must have Client Name, Service Address, Plan and Speed. Account No. and Remote Address are generated automatically.',1)

          p.write_text(s)
          PY
      - name: Commit patched ticket page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-tickets.html
          if ! git diff --cached --quiet; then
            git commit -m 'Enable ticket PPPoE auto provisioning'
            git push
          fi
