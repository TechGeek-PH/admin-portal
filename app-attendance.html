<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#064f83"><title>TechGeekPH Attendance</title><style>:root{--b:#064f83;--b2:#023d6b;--r:#d60736;--ok:#16865e;--w:#b7791f;--ink:#172438;--m:#6b7a8e;--line:#dbe4ee;--bg:#f3f6fa;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input{font:inherit}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}header img{width:100px;height:40px;object-fit:contain}.back{margin-left:auto;text-decoration:none;color:var(--b);font-size:.8rem;font-weight:900;border:1px solid var(--line);padding:9px 11px;border-radius:10px}.wrap{width:min(760px,100%);margin:auto;padding:14px}.hero{padding:18px;border-radius:17px;background:linear-gradient(120deg,var(--b2),var(--b),#55167a);color:#fff}.hero h1{margin:0;font-size:1.35rem}.hero p{margin:6px 0 0;color:#dceafa;font-size:.77rem}.clock{text-align:center;margin-top:12px;padding:17px;background:#fff;border:1px solid var(--line);border-radius:15px}.clock strong{display:block;color:var(--b);font-size:2rem}.clock span{display:block;color:var(--m);font-size:.75rem;margin-top:4px}.today{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}.info{padding:12px;background:#fff;border:1px solid var(--line);border-radius:13px}.info span,.info b{display:block}.info span{color:var(--m);font-size:.66rem;font-weight:850}.info b{margin-top:6px;font-size:.88rem}.field{margin-top:10px}.field label{display:block;margin-bottom:5px;font-size:.7rem;font-weight:900}.field input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:11px;padding:0 12px;font-size:16px}.gps{margin-top:8px;width:100%;min-height:42px;border:1px solid #b9d4e8;border-radius:10px;background:#edf7ff;color:var(--b);font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.actions button{min-height:54px;border-radius:12px;font-weight:900}.in{border:0;background:var(--b);color:#fff}.break{border:1px solid #e2c98a;background:#fff8e7;color:#8a5c0d}.out{border:1px solid #f0b5c3;background:#fff1f4;color:#a3153d}.history{margin-top:18px}.history h2{font-size:1rem}.records{display:grid;gap:8px}.record{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.record-head{display:flex;justify-content:space-between;gap:8px}.record b{font-size:.78rem}.pill{padding:4px 8px;border-radius:999px;background:#eef7ff;color:var(--b);font-size:.62rem;font-weight:900}.times{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.times div{font-size:.68rem;color:#506176}.empty{padding:20px;text-align:center;background:#fff;border:1px dashed #cbd8e5;border-radius:13px;color:var(--m);font-size:.75rem}.notice{display:none;margin-top:10px;padding:10px;border-radius:10px;font-size:.75rem}.notice.show{display:block}.notice.err{background:#fff0f2;color:#a3153d}.notice.ok{background:#eefaf5;color:#126247}@media(min-width:640px){.today{grid-template-columns:repeat(4,1fr)}.actions{grid-template-columns:repeat(4,1fr)}} </style></head><body><header><img src="assets/TechGeekPH%20-%20logo.png" alt="TechGeekPH"><a class="back" href="app.html">← App Home</a></header><main class="wrap"><section class="hero"><h1>My Attendance</h1><p id="who">Secure Supabase time record</p></section><div id="notice" class="notice"></div><section class="clock"><strong id="clock">--:--</strong><span id="date">Today</span></section><section class="today"><div class="info"><span>STATUS</span><b id="status">No log yet</b></div><div class="info"><span>TIME IN</span><b id="tin">--</b></div><div class="info"><span>BREAK</span><b id="brk">--</b></div><div class="info"><span>TIME OUT</span><b id="tout">--</b></div></section><div class="field"><label>Location link</label><input id="loc" placeholder="Use GPS or paste Google Maps link"></div><button id="gps" class="gps">📍 Use Current GPS</button><div class="field"><label>Remarks</label><input id="remarks" placeholder="Optional remarks"></div><section class="actions"><button class="in" data-act="TIME_IN">Time In</button><button class="break" data-act="BREAK_OUT">Break Out</button><button class="break" data-act="BREAK_IN">Break In</button><button class="out" data-act="TIME_OUT">Time Out</button></section><section class="history"><h2>Attendance History</h2><div id="records" class="records"><div class="empty">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),db=window.TechGeekSupabase;let profile=null,today=null;function fmt(v){if(!v)return'--';return new Date(v).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit',hour12:true})}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function note(t,k='ok'){const n=$('notice');n.textContent=t;n.className='notice show '+k;setTimeout(()=>n.className='notice',4000)}function clock(){const n=new Date();$('clock').textContent=n.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true});$('date').textContent=n.toLocaleDateString('en-PH',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}function renderToday(){const r=today||{};$('status').textContent=r.status||'No log yet';$('tin').textContent=fmt(r.time_in);$('brk').textContent=r.break_out?(fmt(r.break_out)+(r.break_in?' → '+fmt(r.break_in):' ongoing')):'--';$('tout').textContent=fmt(r.time_out)}function rec(r){return `<article class="record"><div class="record-head"><b>${esc(r.attendance_date)}</b><span class="pill">${esc(r.status)}</span></div><div class="times"><div>Time In: <b>${fmt(r.time_in)}</b></div><div>Time Out: <b>${fmt(r.time_out)}</b></div><div>Break Out: <b>${fmt(r.break_out)}</b></div><div>Break In: <b>${fmt(r.break_in)}</b></div></div>${r.remarks?`<div style="margin-top:8px;font-size:.7rem;color:#66788b">${esc(r.remarks)}</div>`:''}</article>`}async function load(){const r=await db.from('app_attendance').select('*').order('attendance_date',{ascending:false}).limit(60);if(r.error){$('records').innerHTML='<div class="empty">'+esc(r.error.message)+'</div>';return}const arr=r.data||[],local=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Manila'});today=arr.find(x=>x.attendance_date===local)||null;renderToday();$('records').innerHTML=arr.length?arr.map(rec).join(''):'<div class="empty">No Supabase attendance yet.</div>'}async function boot(){if(!db){location.replace('app.html');return}const s=(await db.auth.getSession()).data.session;if(!s){location.replace('app.html');return}const p=await db.from('staff_profiles').select('full_name,role,active,employee_id').eq('user_id',s.user.id).maybeSingle();if(p.error||!p.data||!p.data.active||p.data.role!=='EMPLOYEE'){location.replace('app.html');return}profile=p.data;$('who').textContent=profile.full_name+' · '+profile.employee_id;await load()}async function action(a){document.querySelectorAll('[data-act]').forEach(b=>b.disabled=true);try{const r=await db.rpc('app_attendance_action',{p_action:a,p_location:$('loc').value.trim()||null,p_remarks:$('remarks').value.trim()||null});if(r.error)throw r.error;today=r.data;renderToday();await load();note(a.replace('_',' ')+' saved using server time.','ok')}catch(e){note(e.message||'Unable to save attendance.','err')}finally{document.querySelectorAll('[data-act]').forEach(b=>b.disabled=false)}}document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act));$('gps').onclick=()=>{if(!navigator.geolocation){note('GPS is unavailable on this device.','err');return}$('gps').disabled=true;navigator.geolocation.getCurrentPosition(p=>{const lat=p.coords.latitude.toFixed(7),lng=p.coords.longitude.toFixed(7);$('loc').value='https://www.google.com/maps?q='+lat+','+lng;$('gps').disabled=false;note('GPS location captured.','ok')},e=>{$('gps').disabled=false;note(e.message||'Unable to read GPS.','err')},{enableHighAccuracy:true,timeout:12000})};clock();setInterval(clock,1000);boot()})();</script></body></html>
