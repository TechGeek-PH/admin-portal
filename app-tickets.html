<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#064f83">
<title>TechGeekPH Technician Tickets</title>
<style>
:root{--b:#064f83;--b2:#023d6b;--p:#55167a;--ok:#16865e;--w:#b86c00;--bad:#b42345;--ink:#172438;--m:#6b7a8e;--line:#dbe4ee;--bg:#f3f6fa;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px}header img{width:104px;height:42px;object-fit:contain}.back{margin-left:auto;text-decoration:none;color:var(--b);font-size:.8rem;font-weight:900;border:1px solid var(--line);padding:9px 11px;border-radius:10px}.wrap{width:min(1050px,100%);margin:auto;padding:14px}.hero{padding:19px;border-radius:18px;background:linear-gradient(120deg,var(--b2),var(--b) 58%,var(--p));color:#fff;box-shadow:0 12px 28px #063c6b20}.hero h1{margin:0;font-size:1.4rem}.hero p{margin:6px 0 0;color:#dceafa;font-size:.77rem}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.stat span,.stat b{display:block}.stat span{font-size:.62rem;color:var(--m);font-weight:900}.stat b{margin-top:5px;color:var(--b);font-size:1.18rem}.bar{display:grid;grid-template-columns:1fr 150px;gap:9px;margin-top:12px}.bar input,.bar select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 12px;font-size:16px}.grid{display:grid;gap:10px;margin-top:12px}.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:0 6px 16px #13324c0b;overflow:hidden}.status-edge{position:absolute;top:0;right:0;min-width:96px;padding:8px 10px;border-radius:0 14px 0 12px;text-align:center;font-size:.58rem;font-weight:950;letter-spacing:.04em}.status-edge.open{background:#eaf4ff;color:#075b8e}.status-edge.progress{background:#fff1dc;color:#985d00}.status-edge.closed{background:#e8f8ef;color:#0d704d}.head{display:flex;justify-content:space-between;gap:10px;padding-right:90px}.head b{color:var(--b);font-size:.9rem}.priority{display:inline-flex;margin-top:6px;padding:4px 8px;border-radius:999px;background:#edf6ff;color:var(--b);font-size:.58rem;font-weight:900}.priority.high{background:#fff0f2;color:#b4183e}.client{margin-top:10px;font-size:.84rem;font-weight:900}.desc{margin-top:5px;color:#536579;font-size:.72rem;line-height:1.45}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.meta div{padding:8px;border-radius:9px;background:#f8fafc;font-size:.67rem}.map-card{display:flex;align-items:center;justify-content:center;min-height:42px;margin-top:10px;border:1px solid #8fc1e8;border-radius:10px;background:#eef7ff;color:#075cb5;text-decoration:none;font-size:.72rem;font-weight:950}.progressbar{height:7px;background:#e5ebf2;border-radius:99px;overflow:hidden;margin:11px 0 5px}.progressbar i{display:block;height:100%;background:var(--ok)}.foot{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:10px}.foot small{color:var(--m);font-size:.64rem}.edit{border:0;border-radius:10px;background:var(--b);color:#fff;padding:10px 13px;font-weight:900}.edit.view{background:#fff;border:1px solid var(--line);color:var(--b)}.empty{padding:30px;text-align:center;color:var(--m);background:#fff;border:1px dashed #cbd8e5;border-radius:15px}.notice{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.75rem}.notice.show{display:block}.notice.err{background:#fff0f2;color:#a3153d}.notice.ok{background:#eefaf5;color:#126247}dialog{width:min(700px,calc(100% - 18px));max-height:92vh;border:0;border-radius:16px;padding:0;box-shadow:0 24px 70px #001c3b50}dialog::backdrop{background:#03182b9e}.dh{display:flex;align-items:center;justify-content:space-between;background:var(--b);color:#fff;padding:14px 15px}.dh h2{margin:0;font-size:1rem}.x{border:0;background:transparent;color:#fff;font-size:1.4rem}.db{padding:14px;max-height:72vh;overflow:auto}.ticket-info{padding:11px;border-radius:11px;background:#f7fafc;color:#536579;font-size:.7rem;line-height:1.55;margin-bottom:11px}.map{display:flex;align-items:center;justify-content:center;min-height:42px;margin-top:10px;border:1px solid #a9c9e8;border-radius:10px;background:#eef7ff;color:#075cb5;text-decoration:none;font-size:.72rem;font-weight:950}.tasks{display:grid;gap:8px}.task{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px}.task input{width:20px;height:20px;flex:0 0 auto}.task span{font-size:.75rem;line-height:1.4}.field{margin-top:12px}.field label{display:block;margin-bottom:5px;font-size:.7rem;font-weight:900}.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}.field textarea{min-height:90px}.hint{margin-top:7px;color:var(--m);font-size:.65rem;line-height:1.4}.actions{display:flex;gap:8px;justify-content:flex-end;padding:12px 14px;border-top:1px solid var(--line)}.actions button{min-height:42px;border-radius:10px;padding:0 14px;font-weight:900}.cancel{border:1px solid var(--line);background:#fff}.save{border:0;background:var(--ok);color:#fff}.embed header{display:none}.embed .wrap{padding-top:74px}@media(min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.bar{grid-template-columns:1fr 190px}.meta{grid-template-columns:repeat(4,1fr)}}@media(max-width:500px){.stats{grid-template-columns:repeat(3,1fr)}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button{width:100%}.embed .wrap{padding-top:68px}}
</style>
</head>
<body>
<header><img src="assets/TechGeekPH%20-%20logo.png" alt="TechGeekPH"><a class="back" href="app.html">← App Home</a></header>
<main class="wrap">
<section class="hero"><h1>Technician Tickets</h1><p id="subtitle">My assigned tickets & checklist</p></section>
<div id="notice" class="notice"></div>
<section class="stats"><div class="stat"><span>MY TICKETS</span><b id="assigned">0</b></div><div class="stat"><span>IN PROGRESS / OPEN</span><b id="active">0</b></div><div class="stat"><span>CLOSED</span><b id="closed">0</b></div></section>
<div class="bar"><input id="q" placeholder="Search ticket / client / issue"><select id="status"><option value="">All status</option><option value="open">Open</option><option value="progress">In Progress</option><option value="closed">Closed</option></select></div>
<section id="grid" class="grid"><div class="empty">Loading technician tickets…</div></section>
</main>
<dialog id="dlg"><div class="dh"><h2 id="dlgTitle">Ticket Checklist</h2><button class="x" id="close" type="button">×</button></div><div class="db"><div id="ticketInfo" class="ticket-info"></div><div id="tasks" class="tasks"></div><div class="field"><label>Work status</label><select id="work"><option>Pending</option><option>On Going</option><option>For Checking</option><option>Done</option></select></div><div class="field"><label>Technician remarks / materials / test result</label><textarea id="remarks" placeholder="What was checked, repaired, replaced, configured, or tested?"></textarea><div class="hint">When all checklist items are checked, the system automatically marks the ticket Done and updates the main Tickets list.</div></div></div><div class="actions"><button class="cancel" id="cancel" type="button">Close</button><button class="save" id="save" type="button">Save Update</button></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js?v=20260822-ticket4"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),db=window.TechGeekSupabase;let profile=null,tickets=[],updates=new Map(),selected=null;if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embed');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=v=>String(v||'').trim().toLowerCase();const sameName=(a,b)=>norm(a).replace(/[^a-z0-9]/g,'')===norm(b).replace(/[^a-z0-9]/g,'');
function note(t,k='ok'){const n=$('notice');n.textContent=t;n.className='notice show '+k;setTimeout(()=>n.className='notice',4200)}
function stage(t,u={}){const s=norm(u.work_status||t.status);if(['done','resolved','closed','completed','cancelled','canceled'].includes(s))return'closed';if(['in progress','on going','ongoing','for checking','acknowledged','on the way','on site','diagnosing','for monitoring'].includes(s))return'progress';if(t.assigned_employee_id||String(t.assigned_tech||'').trim())return'progress';return'open'}
function stageLabel(s){return s==='closed'?'CLOSED':s==='progress'?'IN PROGRESS':'OPEN'}
function mapUrl(t){const direct=String(t.google_maps_link||'').trim();if(direct)return direct;const a=String(t.address||'').trim();return a?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a):''}
function tasksFor(t){const text=[t.category,t.concern,t.ticket_type,t.service_type,t.issue_purpose].join(' ').toLowerCase();let a=['Confirm ticket details and exact client symptom','Inspect power, cables, device status and physical condition','Diagnose the root cause and record findings','Perform the approved repair/configuration','Run final functional test with the client','Record materials used, result and completion notes'];if(/los|fiber|optical/.test(text))a=['Verify LOS/PON state and client-reported outage','Measure optical power and inspect connectors/drop fiber','Trace bend, cut, splice or connector fault','Repair/re-splice/replace damaged fiber section as needed','Recheck ONU registration and final optical level','Run internet test and confirm restoration with client'];else if(/slow|latency|ping|wifi|wi-fi/.test(text))a=['Confirm affected devices/area and reproduce issue','Check ONU/router/AP power, link and optical/WAN state','Run wired ping, packet-loss and speed test','Check Wi-Fi RSSI/channel/interference and bandwidth use','Apply approved configuration/placement correction','Retest wired/Wi-Fi performance and confirm with client'];else if(/install/.test(text))a=['Verify approved installation scope and client details','Inspect route, power, NAP/port and required materials','Install/mount/cable equipment safely','Configure ONU/router/service credentials','Run optical, ping and speed tests','Document final setup and client turnover'];else if(/cctv|camera|dvr|nvr/.test(text))a=['Confirm affected camera/channel and symptom','Check camera/PoE/power and cabling','Check DVR/NVR channel, IP and storage state','Repair connection/configuration/device issue','Test live view, recording and playback','Document result and client confirmation'];return a}
async function boot(){if(!db){location.replace('app.html');return}const s=(await db.auth.getSession()).data.session;if(!s){location.replace('app.html');return}const pr=await db.from('staff_profiles').select('full_name,role,active,employee_id').eq('user_id',s.user.id).maybeSingle();if(pr.error||!pr.data||!pr.data.active){location.replace('app.html');return}profile=pr.data;$('subtitle').textContent=(profile.role==='EMPLOYEE'?'Assigned to '+profile.full_name+' · '+profile.employee_id:'Admin ticket access')+' · Supabase secured';await load();try{db.channel('my-tech-tickets-'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:'support_tickets'},()=>load()).on('postgres_changes',{event:'*',schema:'public',table:'technician_ticket_checklists'},()=>load()).subscribe()}catch(_){}}
async function load(){const [tr,ur]=await Promise.all([db.from('tech_ticket_public_queue').select('*').order('created_date',{ascending:false}).order('ticket_no',{ascending:false}),db.from('technician_ticket_checklists').select('*')]);if(tr.error){$('grid').innerHTML='<div class="empty">'+esc(tr.error.message)+'</div>';return}let all=tr.data||[];if(profile.role==='EMPLOYEE')all=all.filter(t=>String(t.assigned_employee_id||'')===String(profile.employee_id||'')||(!t.assigned_employee_id&&sameName(t.assigned_tech,profile.full_name)));tickets=all;updates=new Map((ur.data||[]).map(x=>[x.ticket_no,x]));const closed=tickets.filter(t=>stage(t,updates.get(t.ticket_no)||{})==='closed').length;$('assigned').textContent=tickets.length;$('closed').textContent=closed;$('active').textContent=Math.max(0,tickets.length-closed);render()}
function render(){const q=$('q').value.trim().toLowerCase(),st=$('status').value;const list=tickets.filter(t=>{const u=updates.get(t.ticket_no)||{},sg=stage(t,u),hay=[t.ticket_no,t.client_name,t.client_account_no,t.issue_purpose,t.concern,t.assigned_tech,t.address,t.tech_remarks,u.remarks].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!st||sg===st)});$('grid').innerHTML=list.length?list.map(t=>{const u=updates.get(t.ticket_no)||{},items=Array.isArray(u.checklist_items)&&u.checklist_items.length?u.checklist_items:tasksFor(t),checks=Array.isArray(u.checks)&&u.checks.length===items.length?u.checks:items.map(()=>false),done=checks.filter(Boolean).length,pct=items.length?Math.round(done/items.length*100):0,sg=stage(t,u),mu=mapUrl(t);return `<article class="card"><span class="status-edge ${sg}">${stageLabel(sg)}</span><div class="head"><b>${esc(t.ticket_no)}</b></div><span class="priority ${/urgent|high|critical/i.test(t.priority||'')?'high':''}">${esc(t.priority||'Normal')} Priority</span><div class="client">${esc(t.client_name||'No client')}</div><div class="desc">${esc(t.issue_purpose||t.concern||'No issue description')}</div><div class="meta"><div><b>Status</b><br>${stageLabel(sg)}</div><div><b>Assigned</b><br>${esc(t.assigned_tech||'—')}</div><div><b>Schedule</b><br>${esc(t.schedule_date||'—')}</div><div><b>Account</b><br>${esc(t.client_account_no||'—')}</div></div>${mu?`<a class="map-card" href="${esc(mu)}" target="_blank" rel="noopener">📍 OPEN CLIENT LOCATION IN MAPS</a>`:''}<div class="progressbar"><i style="width:${pct}%"></i></div><div class="foot"><small>${done}/${items.length} checklist tasks</small><button class="edit ${sg==='closed'?'view':''}" data-id="${esc(t.ticket_no)}">${sg==='closed'?'View Details':'Update'}</button></div></article>`}).join(''):'<div class="empty">No matching technician tickets.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openTicket(b.dataset.id))}
function openTicket(id){selected=tickets.find(t=>t.ticket_no===id);if(!selected)return;const u=updates.get(id)||{},items=Array.isArray(u.checklist_items)&&u.checklist_items.length?u.checklist_items:tasksFor(selected),checks=Array.isArray(u.checks)&&u.checks.length===items.length?u.checks:items.map(()=>false),sg=stage(selected,u),mu=mapUrl(selected);$('dlgTitle').textContent=id+' · '+stageLabel(sg);$('ticketInfo').innerHTML=`<b>${esc(selected.client_name||'')}</b><br>${esc(selected.client_account_no||'No account')} · ${esc(selected.contact_number||'No contact')}<br><b>Assigned:</b> ${esc(selected.assigned_tech||'—')}<br><b>Address:</b> ${esc([selected.rd_blk,selected.address].filter(Boolean).join(' · ')||'—')}<br><b>Issue:</b> ${esc(selected.issue_purpose||selected.concern||'—')}${selected.admin_remarks?'<br><b>Admin remarks:</b> '+esc(selected.admin_remarks):''}${mu?'<a class="map" href="'+esc(mu)+'" target="_blank" rel="noopener">📍 Open Client in Google Maps</a>':''}`;$('tasks').innerHTML=items.map((x,i)=>`<label class="task"><input type="checkbox" data-check="${i}" ${checks[i]?'checked':''} ${sg==='closed'&&profile.role==='EMPLOYEE'?'disabled':''}><span><b>${i+1}.</b> ${esc(x)}</span></label>`).join('');$('work').value=u.work_status||selected.status||'Pending';if(![...$('work').options].some(o=>o.value===$('work').value))$('work').value=sg==='closed'?'Done':'Pending';$('remarks').value=u.remarks||selected.tech_remarks||'';const ro=sg==='closed'&&profile.role==='EMPLOYEE';$('work').disabled=ro;$('remarks').readOnly=ro;$('save').style.display=ro?'none':'';$('dlg').showModal()}
async function save(){if(!selected)return;const btn=$('save');btn.disabled=true;btn.textContent='Saving…';try{const items=[...document.querySelectorAll('.task span')].map(x=>x.textContent.replace(/^\d+\.\s*/,'')),checks=[...document.querySelectorAll('[data-check]')].map(x=>x.checked);const r=await db.rpc('save_technician_ticket_update',{p_ticket_no:selected.ticket_no,p_checklist_items:items,p_checks:checks,p_work_status:$('work').value,p_remarks:$('remarks').value.trim()||null});if(r.error)throw r.error;$('dlg').close();await load();note('Checklist, ticket status, and technician remarks saved.','ok')}catch(e){note(e.message||'Unable to save ticket update.','err')}finally{btn.disabled=false;btn.textContent='Save Update'}}
$('q').oninput=render;$('status').onchange=render;$('close').onclick=$('cancel').onclick=()=>$('dlg').close();$('save').onclick=save;boot();})();
</script>
</body>
</html>
