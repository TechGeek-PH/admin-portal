<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#064f83"><title>TechGeekPH Tickets</title><style>:root{--b:#064f83;--b2:#023d6b;--r:#d60736;--ok:#16865e;--w:#e68709;--ink:#172438;--m:#6b7a8e;--line:#dbe4ee;--bg:#f3f6fa;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px}header img{width:100px;height:40px;object-fit:contain}.back{margin-left:auto;text-decoration:none;color:var(--b);font-size:.8rem;font-weight:900;border:1px solid var(--line);padding:9px 11px;border-radius:10px}.wrap{width:min(1050px,100%);margin:auto;padding:14px}.hero{padding:18px;border-radius:17px;background:linear-gradient(120deg,var(--b2),var(--b),#55167a);color:#fff}.hero h1{margin:0;font-size:1.35rem}.hero p{margin:6px 0 0;color:#dceafa;font-size:.77rem}.bar{display:grid;grid-template-columns:1fr 130px;gap:9px;margin-top:12px}.bar input,.bar select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 12px;font-size:16px}.grid{display:grid;gap:10px;margin-top:12px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:0 6px 16px #13324c0b}.head{display:flex;justify-content:space-between;gap:10px}.head b{color:var(--b);font-size:.9rem}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:#edf6ff;color:var(--b);font-size:.62rem;font-weight:900}.pill.high{background:#fff0f2;color:#b4183e}.client{margin-top:9px;font-size:.82rem;font-weight:850}.desc{margin-top:5px;color:#536579;font-size:.72rem;line-height:1.45}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.meta div{padding:8px;border-radius:9px;background:#f8fafc;font-size:.67rem}.progress{height:7px;background:#e5ebf2;border-radius:99px;overflow:hidden;margin:11px 0 5px}.progress i{display:block;height:100%;background:var(--ok)}.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}.foot small{color:var(--m);font-size:.64rem}.edit{border:0;border-radius:10px;background:var(--b);color:#fff;padding:10px 13px;font-weight:900}.empty{padding:30px;text-align:center;color:var(--m);background:#fff;border:1px dashed #cbd8e5;border-radius:15px}dialog{width:min(680px,calc(100% - 18px));max-height:92vh;border:0;border-radius:16px;padding:0;box-shadow:0 24px 70px #001c3b50}dialog::backdrop{background:#03182b9e}.dh{display:flex;align-items:center;justify-content:space-between;background:var(--b);color:#fff;padding:14px 15px}.dh h2{margin:0;font-size:1rem}.x{border:0;background:transparent;color:#fff;font-size:1.4rem}.db{padding:14px;max-height:72vh;overflow:auto}.tasks{display:grid;gap:8px}.task{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px}.task input{width:20px;height:20px;flex:0 0 auto}.task span{font-size:.75rem;line-height:1.4}.field{margin-top:12px}.field label{display:block;margin-bottom:5px;font-size:.7rem;font-weight:900}.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px}.field textarea{min-height:85px}.actions{display:flex;gap:8px;justify-content:flex-end;padding:12px 14px;border-top:1px solid var(--line)}.actions button{min-height:42px;border-radius:10px;padding:0 14px;font-weight:900}.cancel{border:1px solid var(--line);background:#fff}.save{border:0;background:var(--ok);color:#fff}.notice{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.75rem}.notice.show{display:block}.notice.err{background:#fff0f2;color:#a3153d}.notice.ok{background:#eefaf5;color:#126247}@media(min-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.bar{grid-template-columns:1fr 180px}.meta{grid-template-columns:repeat(4,1fr)}}</style></head><body><header><img src="assets/TechGeekPH%20-%20logo.png" alt="TechGeekPH"><a class="back" href="app.html">← App Home</a></header><main class="wrap"><section class="hero"><h1>Technician Tickets</h1><p id="subtitle">Secure assigned-ticket checklist</p></section><div id="notice" class="notice"></div><div class="bar"><input id="q" placeholder="Search ticket / client / issue"><select id="status"><option value="">All status</option><option>Pending</option><option>On Going</option><option>Done</option><option>Resolved</option></select></div><section id="grid" class="grid"><div class="empty">Loading secure tickets…</div></section></main><dialog id="dlg"><div class="dh"><h2 id="dlgTitle">Checklist</h2><button class="x" id="close">×</button></div><div class="db"><div id="tasks" class="tasks"></div><div class="field"><label>Work status</label><select id="work"><option>Pending</option><option>On Going</option><option>For Checking</option><option>Done</option></select></div><div class="field"><label>Technician remarks / materials / test result</label><textarea id="remarks"></textarea></div></div><div class="actions"><button class="cancel" id="cancel">Cancel</button><button class="save" id="save">Save Update</button></div></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),db=window.TechGeekSupabase;let profile=null,tickets=[],updates=new Map(),selected=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function note(t,k='ok'){const n=$('notice');n.textContent=t;n.className='notice show '+k;setTimeout(()=>n.className='notice',4000)}function tasksFor(t){const text=[t.category,t.concern,t.ticket_type,t.service_type,t.issue_purpose].join(' ').toLowerCase();let a=['Confirm ticket details and exact client symptom','Inspect power, cables, device status and physical condition','Diagnose the root cause and record findings','Perform the approved repair/configuration','Run final functional test with the client','Record materials used, result and completion notes'];if(/los|fiber|optical/.test(text))a=['Verify LOS/PON state and client-reported outage','Measure optical power and inspect connectors/drop fiber','Trace bend, cut, splice or connector fault','Repair/re-splice/replace damaged fiber section as needed','Recheck ONU registration and final optical level','Run internet test and confirm restoration with client'];else if(/slow|latency|ping|wifi|wi-fi/.test(text))a=['Confirm affected devices/area and reproduce issue','Check ONU/router/AP power, link and optical/WAN state','Run wired ping, packet-loss and speed test','Check Wi-Fi RSSI/channel/interference and bandwidth use','Apply approved configuration/placement correction','Retest wired/Wi-Fi performance and confirm with client'];else if(/install/.test(text))a=['Verify approved installation scope and client details','Inspect route, power, NAP/port and required materials','Install/mount/cable equipment safely','Configure ONU/router/service credentials','Run optical, ping and speed tests','Document final setup and client turnover'];else if(/cctv|camera|dvr|nvr/.test(text))a=['Confirm affected camera/channel and symptom','Check camera/PoE/power and cabling','Check DVR/NVR channel, IP and storage state','Repair connection/configuration/device issue','Test live view, recording and playback','Document result and client confirmation'];return a}async function boot(){if(!db){location.replace('app.html');return}const s=(await db.auth.getSession()).data.session;if(!s){location.replace('app.html');return}const pr=await db.from('staff_profiles').select('full_name,role,active,employee_id').eq('user_id',s.user.id).maybeSingle();if(pr.error||!pr.data||!pr.data.active){location.replace('app.html');return}profile=pr.data;$('subtitle').textContent=(profile.role==='EMPLOYEE'?'Assigned to '+profile.full_name:'Admin ticket access')+' · Supabase secured';await load()}async function load(){const [tr,ur]=await Promise.all([db.from('app_ticket_queue').select('*').order('created_date',{ascending:false}).order('ticket_no',{ascending:false}),db.from('technician_ticket_checklists').select('*')]);if(tr.error){$('grid').innerHTML='<div class="empty">'+esc(tr.error.message)+'</div>';return}tickets=tr.data||[];updates=new Map((ur.data||[]).map(x=>[x.ticket_no,x]));render()}function render(){const q=$('q').value.trim().toLowerCase(),st=$('status').value;const list=tickets.filter(t=>{const u=updates.get(t.ticket_no)||{},status=u.work_status||t.status||'Pending',hay=[t.ticket_no,t.client_name,t.client_account_no,t.issue_purpose,t.concern,t.assigned_tech].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!st||status===st)});$('grid').innerHTML=list.length?list.map(t=>{const u=updates.get(t.ticket_no)||{},items=Array.isArray(u.checklist_items)&&u.checklist_items.length?u.checklist_items:tasksFor(t),checks=Array.isArray(u.checks)?u.checks:items.map(()=>false),done=checks.filter(Boolean).length,pct=items.length?Math.round(done/items.length*100):0,status=u.work_status||t.status||'Pending';return `<article class="card"><div class="head"><b>${esc(t.ticket_no)}</b><span class="pill ${/urgent|high|critical/i.test(t.priority||'')?'high':''}">${esc(t.priority||'Normal')}</span></div><div class="client">${esc(t.client_name||'No client')}</div><div class="desc">${esc(t.issue_purpose||t.concern||'No issue description')}</div><div class="meta"><div><b>Status</b><br>${esc(status)}</div><div><b>Assigned</b><br>${esc(t.assigned_tech||'—')}</div><div><b>Schedule</b><br>${esc(t.schedule_date||'—')}</div><div><b>Account</b><br>${esc(t.client_account_no||'—')}</div></div><div class="progress"><i style="width:${pct}%"></i></div><div class="foot"><small>${done}/${items.length} checklist tasks</small><button class="edit" data-id="${esc(t.ticket_no)}">Update</button></div></article>`}).join(''):'<div class="empty">No matching assigned tickets.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(b.dataset.id))}function open(id){selected=tickets.find(t=>t.ticket_no===id);if(!selected)return;const u=updates.get(id)||{},items=Array.isArray(u.checklist_items)&&u.checklist_items.length?u.checklist_items:tasksFor(selected),checks=Array.isArray(u.checks)&&u.checks.length===items.length?u.checks:items.map(()=>false);$('dlgTitle').textContent=id+' · '+(selected.client_name||'Ticket');$('tasks').innerHTML=items.map((x,i)=>`<label class="task"><input type="checkbox" data-check="${i}" ${checks[i]?'checked':''}><span><b>${i+1}.</b> ${esc(x)}</span></label>`).join('');$('work').value=u.work_status||'Pending';$('remarks').value=u.remarks||'';$('dlg').showModal()}async function save(){if(!selected)return;const items=[...document.querySelectorAll('.task span')].map(x=>x.textContent.replace(/^\d+\.\s*/,'')),checks=[...document.querySelectorAll('[data-check]')].map(x=>x.checked),complete=checks.length&&checks.every(Boolean),work=complete?'Done':$('work').value;const payload={ticket_no:selected.ticket_no,checklist_key:'secure-app-v1',checklist_items:items,checks,done_by:profile.full_name,work_status:work,remarks:$('remarks').value.trim(),completed_at:complete?new Date().toISOString():null,updated_at:new Date().toISOString()};const r=await db.from('technician_ticket_checklists').upsert(payload,{onConflict:'ticket_no'}).select().single();if(r.error){note(r.error.message,'err');return}updates.set(selected.ticket_no,r.data);$('dlg').close();render();note('Ticket checklist saved.','ok')}$('q').oninput=render;$('status').onchange=render;$('close').onclick=()=>$('dlg').close();$('cancel').onclick=()=>$('dlg').close();$('save').onclick=save;boot()})();</script></body></html>
