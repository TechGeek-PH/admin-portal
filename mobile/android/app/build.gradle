plugins {
    id 'com.android.application'
}

android {
    namespace 'ph.techgeek.installer'
    compileSdk 35

    defaultConfig {
        applicationId 'ph.techgeek.installer'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '1.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
