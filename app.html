<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#064f83"><meta name="robots" content="noindex,nofollow"><title>TechGeekPH</title>
<style>:root{--blue:#064f83;--blue2:#023d6b;--red:#d60736;--ink:#172438;--muted:#6b7a8e;--line:#dbe4ee;--bg:#f3f6fa;--ok:#16865e;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box;min-width:0}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--ink);overflow-x:hidden}button,input,summary{font:inherit}.hidden{display:none!important}.login{min-height:100dvh;background:linear-gradient(180deg,#edf5fc,#f8fafc 42%,#f3f6fa)}.brand{padding:32px 22px 27px;text-align:center;background:linear-gradient(145deg,var(--blue2),var(--blue));color:#fff}.brand img{width:min(275px,76vw);background:#fff;border-radius:16px;padding:11px}.brand h1{margin:14px 0 4px;font-size:1.6rem}.brand p{margin:0;color:#dceafb;font-size:.86rem}.login-wrap{display:grid;place-items:start center;padding:24px 16px}.card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 18px 50px #14395a18}.card h2{margin:0 0 6px}.lead{margin:0 0 18px;color:var(--muted);font-size:.82rem}.field{margin-bottom:13px}.field label{display:block;margin-bottom:6px;font-size:.74rem;font-weight:850}.field input{width:100%;min-height:50px;border:1px solid #ccd9e6;border-radius:11px;padding:0 13px;font-size:16px;background:#f7faff}.pw{position:relative}.pw input{padding-right:68px}.showpw{position:absolute;right:6px;top:6px;height:38px;border:0;border-radius:8px;background:#eef4f8;color:var(--blue);font-size:.7rem;font-weight:900}.primary{width:100%;min-height:50px;border:0;border-radius:11px;background:linear-gradient(100deg,var(--blue),var(--blue2));color:#fff;font-weight:900}.msg{display:none;margin-top:12px;padding:10px;border-radius:9px;font-size:.78rem}.msg.show{display:block}.msg.error{background:#fff0f3;color:#a3153d}.shell{min-height:100dvh;padding-bottom:76px}.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;height:64px;padding:9px 12px;background:#fff;border-bottom:1px solid var(--line)}.top img{width:104px;max-width:34vw;height:42px;object-fit:contain}.userbox{margin-left:auto;text-align:right;max-width:48vw}.userbox b,.userbox span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.userbox b{font-size:.78rem}.userbox span{font-size:.64rem;color:var(--muted)}.logout{width:40px;height:40px;flex:0 0 40px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--red);font-size:18px}.content{width:100%;max-width:1100px;margin:auto;padding:14px}.welcome{padding:20px;border-radius:17px;color:#fff;background:linear-gradient(120deg,var(--blue2),var(--blue) 58%,#4d177b)}.welcome small,.welcome strong,.welcome span{display:block}.welcome small{opacity:.82;font-size:.68rem;font-weight:850}.welcome strong{font-size:1.4rem;margin-top:5px}.welcome span{margin-top:5px;color:#dceafb;font-size:.75rem}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:11px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;min-height:82px}.stat span,.stat b,.stat small{display:block}.stat span{font-size:.64rem;color:var(--muted);font-weight:850}.stat b{margin-top:7px;color:var(--blue);font-size:1.25rem}.stat small{margin-top:3px;color:var(--muted);font-size:.58rem}.section-title{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:18px 2px 9px}.section-title h2{margin:0;font-size:1rem}.section-title span{font-size:.64rem;color:var(--muted);text-align:right}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{display:flex;flex-direction:column;min-height:112px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-decoration:none}.tile .ico{font-size:1.28rem}.tile b{margin-top:auto;font-size:.8rem}.tile small{margin-top:4px;color:var(--muted);font-size:.63rem;overflow-wrap:anywhere}.panel{display:none}.panel.active{display:block}.records{display:grid;gap:10px}.empty{padding:25px;text-align:center;border:1px dashed #cbd8e5;border-radius:12px;color:var(--muted);background:#fff}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:70;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}.bottom button{border:0;background:transparent;color:#66788b;font-size:.62rem;font-weight:850;min-height:48px;border-radius:9px}.bottom button.active{color:var(--blue);background:#edf6fd}.bottom i{display:block;font-style:normal;font-size:1.12rem}.module-toolbar{position:fixed;top:64px;left:0;right:0;z-index:60;display:flex;align-items:center;gap:10px;height:58px;padding:9px 12px;background:#fff;border-bottom:1px solid var(--line)}.back{height:40px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:850}.frame{position:fixed;top:122px;left:0;right:0;width:100vw;height:calc(100dvh - 188px);border:0;background:var(--bg)}body.module-open{position:fixed;inset:0;height:100dvh;overflow:hidden}.shell.module-mode .content{position:fixed;inset:64px 0 66px;padding:0;overflow:hidden}.shell.module-mode .dashboard-head{display:none!important}.profile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.profile b,.profile span{display:block}.profile span{margin-top:5px;color:var(--muted);font-size:.75rem}@media(min-width:720px){.stats{grid-template-columns:repeat(5,minmax(0,1fr))}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style>
</head><body>
<section id="login" class="login"><div class="brand"><img src="assets/TechGeekPH%20-%20logo.png"><h1>TechGeekPH</h1><p>Employee & Admin Operations App</p></div><div class="login-wrap"><form id="loginForm" class="card"><h2>Sign in</h2><p class="lead">Secure login for TechGeekPH staff.</p><div class="field"><label>Username or email</label><input id="identifier" required></div><div class="field"><label>Password / PIN</label><div class="pw"><input id="password" type="password" required><button id="showPw" class="showpw" type="button">Show</button></div></div><button id="loginBtn" class="primary">Sign in to TechGeekPH</button><div id="loginMsg" class="msg"></div></form></div></section>
<section id="shell" class="shell hidden"><header class="top"><img src="assets/TechGeekPH%20-%20logo.png"><div class="userbox"><b id="topName"></b><span id="topRole"></span></div><button id="logout" class="logout">↪</button></header><main class="content"><div class="dashboard-head"><section class="welcome"><small id="welcomeRole"></small><strong id="welcomeName"></strong><span id="welcomeSub"></span></section><div id="stats" class="stats"></div></div><section id="home" class="panel active"><div class="section-title"><h2>Workspace</h2><span>Live operations</span></div><div id="menu" class="grid"></div></section><section id="modules" class="panel"><div class="section-title"><h2>All Modules</h2><span id="moduleHint"></span></div><div id="allModules" class="grid"></div></section><section id="tickets" class="panel"><div class="section-title"><h2>Tickets</h2></div><div id="ticketRecords" class="records"></div></section><section id="account" class="panel"><div class="section-title"><h2>Account</h2></div><div id="profile"></div></section><section id="module" class="panel"><div class="module-toolbar"><button id="back" class="back">← Back</button><b id="moduleTitle">Module</b></div><iframe id="frame" class="frame" allow="camera; geolocation; clipboard-read; clipboard-write"></iframe></section></main><nav class="bottom" id="nav"><button class="active" data-panel="home"><i>⌂</i>Home</button><button data-panel="modules"><i>▦</i>Modules</button><button data-panel="tickets"><i>✓</i>Tickets</button><button data-panel="account"><i>●</i>Account</button></nav></section>
<script>(function(){'use strict';const BUILD='20260831-duty-module-v11',BASE='https://tcexzfztdgximrzuosqs.supabase.co',KEY='sb_publishable_8H8_S7NTWvzPCLvYUe2C4g_k3Ltjfiz',STORE='tg_session_v3',SBSTORE='sb-tcexzfztdgximrzuosqs-auth-token',PORTAL='techgeekph_admin_session';let session=null,profile=null,tickets=[],clients=[];const $=id=>document.getElementById(id);const EMP=[['app-attendance.html','⏱','Time In / Time Out','Attendance and breaks'],['https://techgeek-ph.github.io/employee-portal-v1.0/on_duty_monitoring.html','👷','My Duty Monitoring','Shift tickets, accomplishments and idle time'],['app-tickets.html','✓','Technician Tickets','Installation, repair, relocation and assigned service updates'],['nap-checker-employee.html','◉','NAP Checker','NAP map, ports, clients and live ping status'],['my_expense_request.html','₱','My Expenses','Expense requests'],['app-payslips.html','▥','Payslips','Payroll records']];const ADMIN=[['tickets.html','🎫','Tickets Admin','Create and manage all installation, repair, relocation and IT service tickets'],['clients.html','👥','Clients','Client master records'],['client-data-quality.html','⚠','Data Quality','Incomplete client records to review'],['billing.html','₱','Billing Control','Billing and payments'],['statement_of_account.html','🧾','SOA & Acknowledgement Receipt','Generate client statement of account and acknowledgement receipt'],['nap-checker.html','◉','NAP Checker','NAP ports and clients'],['expense_approval.html','₱','Expense Approval','Review staff expenses'],['payroll-loans.html','₱','Payroll & Loans','Payroll, employee payslips and loan management'],['https://techgeek-ph.github.io/employee-portal-v1.0/on_duty_monitoring.html','👷','On Duty Monitoring','Monitor staff shifts, active tickets, accomplishments and potential idle time']];function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function norm(v){return String(v||'').trim().toLowerCase()}function role(){return String(profile&&profile.role||'').toUpperCase()}function saveSession(s){session=s;try{localStorage.setItem(STORE,JSON.stringify(s));localStorage.setItem(SBSTORE,JSON.stringify(s))}catch(_){}}function clearSession(){session=null;try{localStorage.removeItem(STORE);localStorage.removeItem(SBSTORE);localStorage.removeItem(PORTAL)}catch(_){}}async function refreshAuth(){if(!session||!session.refresh_token)return false;try{const r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;const s=await r.json();if(!s||!s.access_token)return false;saveSession(s);return true}catch(_){return false}}async function request(path,opt,auth,retry){opt=opt||{};const headers=Object.assign({apikey:KEY,'Content-Type':'application/json'},opt.headers||{});if(auth!==false&&session&&session.access_token)headers.Authorization='Bearer '+session.access_token;const r=await fetch(BASE+path,Object.assign({},opt,{headers}));if(r.status===401&&auth!==false&&retry!==false&&await refreshAuth())return request(path,opt,auth,false);const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch(_){data=text}if(!r.ok)throw new Error(data&&data.message||data&&data.error_description||'Request failed '+r.status);return data}async function resolveLogin(id){if(id.includes('@'))return id;const d=await request('/rest/v1/rpc/resolve_app_login',{method:'POST',body:JSON.stringify({p_identifier:id})},false);if(!d)throw new Error('Account not found.');return String(d)}async function loadProfile(){const d=await request('/rest/v1/staff_profiles?select=*&user_id=eq.'+encodeURIComponent(session.user.id)+'&limit=1',{method:'GET'});profile=Array.isArray(d)&&d[0];if(!profile||!profile.active)throw new Error('Inactive account.');profile.role=String(profile.role||'').toUpperCase()}function tile(x){return '<a class="tile" href="'+esc(x[0])+'" data-title="'+esc(x[2])+'"><span class="ico">'+x[1]+'</span><b>'+esc(x[2])+'</b><small>'+esc(x[3])+'</small></a>'}function renderMenu(){let list=role()==='EMPLOYEE'?EMP.slice():ADMIN.slice();if(role()==='OWNER')list.push(['admin_accounts.html','⚙','User Accounts','Create, activate and reset staff accounts']);$('menu').innerHTML=$('allModules').innerHTML=list.map(tile).join('');$('moduleHint').textContent=list.length+' modules'}function ticketStage(t){const s=norm(t.status);if(['done','resolved','closed','completed','cancelled','canceled'].includes(s))return'closed';if(['in progress','on going','ongoing','for checking','acknowledged','on the way','on site','diagnosing','for monitoring','assigned'].includes(s)||t.assigned_employee_id||String(t.assigned_tech||'').trim())return'progress';return'open'}async function loadTickets(){try{const d=await request('/rest/v1/tech_ticket_public_queue?select=*&order=created_date.desc&order=ticket_no.desc&limit=500',{method:'GET'});tickets=Array.isArray(d)?d:[]}catch(_){tickets=[]}renderTickets()}function renderTickets(){const box=$('ticketRecords');box.innerHTML=tickets.slice(0,100).map(t=>'<div class="card"><b>'+esc(t.ticket_no||'Ticket')+'</b><p class="lead">'+esc(t.client_name||'')+' · '+esc(t.status||'')+'</p></div>').join('')||'<div class="empty">No tickets.</div>'}function stat(x){return '<div class="stat"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b><small>'+esc(x[2])+'</small></div>'}async function loadHome(){await loadTickets();if(role()==='EMPLOYEE'){$('stats').innerHTML=[['Open',tickets.filter(t=>ticketStage(t)==='open').length,'Team queue'],['My Tickets',tickets.filter(t=>String(t.assigned_employee_id||'')===String(profile.employee_id||'')).length,'Assigned to me'],['In Progress',tickets.filter(t=>ticketStage(t)==='progress').length,'Active'],['Closed',tickets.filter(t=>ticketStage(t)==='closed').length,'Completed']].map(stat).join('')}else{try{const d=await request('/rest/v1/clients?select=account_no,account_status&limit=1500',{method:'GET'});clients=Array.isArray(d)?d:[]}catch(_){}const active=clients.filter(c=>norm(c.account_status).startsWith('active')).length;$('stats').innerHTML=[['Total Clients',clients.length,'Client records'],['Active Clients',active,'Active accounts'],['Open',tickets.filter(t=>ticketStage(t)==='open').length,'New / unclaimed'],['In Progress',tickets.filter(t=>ticketStage(t)==='progress').length,'Assigned / active'],['Closed',tickets.filter(t=>ticketStage(t)==='closed').length,'Completed']].map(stat).join('')}}function renderProfile(){$('profile').innerHTML='<div class="profile"><b>'+esc(profile.full_name||'Staff')+'</b><span>'+esc(role())+' · '+esc(profile.employee_id||profile.username||'TechGeekPH account')+'</span><span>Build: '+BUILD+'</span></div>'}async function enter(s){session=s;await loadProfile();$('topName').textContent=profile.full_name;$('topRole').textContent=role();$('welcomeName').textContent='Hello, '+String(profile.full_name||'Staff').split(' ')[0];$('welcomeRole').textContent=role();$('welcomeSub').textContent=role()==='EMPLOYEE'?'All installation, repair and relocation work is handled inside assigned tickets.':'Create and manage all field work from the centralized Tickets system.';renderMenu();renderProfile();$('login').classList.add('hidden');$('shell').classList.remove('hidden');await loadHome()}function activate(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.panel===id));const mod=id==='module';$('shell').classList.toggle('module-mode',mod);document.body.classList.toggle('module-open',mod);if(!mod)$('frame').src='about:blank';if(id==='tickets')loadTickets();if(id==='account')renderProfile();if(!mod)window.scrollTo(0,0)}$('loginForm').onsubmit=async e=>{e.preventDefault();const btn=$('loginBtn');btn.disabled=true;try{const email=await resolveLogin($('identifier').value.trim()),d=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password:$('password').value})},false);saveSession(d);await enter(d);$('loginMsg').className='msg'}catch(err){$('loginMsg').textContent=err.message||'Login failed.';$('loginMsg').className='msg show error'}finally{btn.disabled=false}};$('showPw').onclick=()=>{$('password').type=$('password').type==='password'?'text':'password';$('showPw').textContent=$('password').type==='password'?'Show':'Hide'};$('logout').onclick=()=>{clearSession();location.reload()};document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>activate(b.dataset.panel));document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a.tile');if(!a)return;e.preventDefault();const href=a.getAttribute('href');$('moduleTitle').textContent=a.dataset.title;$('frame').src=href+(href.includes('?')?'&':'?')+'embed=1&source=app-v11&t='+Date.now();activate('module')});$('back').onclick=()=>activate('modules');(async()=>{try{let s=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(SBSTORE)||'null');if(s&&s.access_token){session=s;await enter(s)}}catch(e){clearSession();$('login').classList.remove('hidden');$('shell').classList.add('hidden')}})();})();</script></body></html>
