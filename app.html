<style>

*{box-sizing:border-box;min-width:0}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--ink);overflow-x:hidden}button,input,summary{font:inherit}.hidden{display:none!important}
.login{min-height:100dvh;background:linear-gradient(180deg,#edf5fc,#f8fafc 42%,#f3f6fa)}.brand{padding:32px 22px 27px;text-align:center;background:linear-gradient(145deg,var(--blue2),var(--blue));color:#fff}.brand img{width:min(275px,76vw);background:#fff;border-radius:16px;padding:11px}.brand h1{margin:14px 0 4px;font-size:1.6rem}.brand p{margin:0;color:#dceafb;font-size:.86rem}.login-wrap{display:grid;place-items:start center;padding:24px 16px}.card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 18px 50px #14395a18}.card h2{margin:0 0 6px}.lead{margin:0 0 18px;color:var(--muted);font-size:.82rem}.field{margin-bottom:13px}.field label{display:block;margin-bottom:6px;font-size:.74rem;font-weight:850}.field input{width:100%;min-height:50px;border:1px solid #ccd9e6;border-radius:11px;padding:0 13px;font-size:16px;background:#f7faff}.pw{position:relative}.pw input{padding-right:68px}.showpw{position:absolute;right:6px;top:6px;height:38px;border:0;border-radius:8px;background:#eef4f8;color:var(--blue);font-size:.7rem;font-weight:900}.primary{width:100%;min-height:50px;border:0;border-radius:11px;background:linear-gradient(100deg,var(--blue),var(--blue2));color:#fff;font-weight:900}.msg{display:none;margin-top:12px;padding:10px;border-radius:9px;font-size:.78rem}.msg.show{display:block}.msg.error{background:#fff0f3;color:#a3153d}
.shell{min-height:100dvh;padding-bottom:76px}.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;height:64px;padding:9px 12px;background:#fff;border-bottom:1px solid var(--line)}.top img{width:104px;max-width:34vw;height:42px;object-fit:contain}.userbox{margin-left:auto;text-align:right;max-width:48vw}.userbox b,.userbox span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.userbox b{font-size:.78rem}.userbox span{font-size:.64rem;color:var(--muted)}.logout{width:40px;height:40px;flex:0 0 40px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--red);font-size:18px}
.content{width:100%;max-width:1100px;margin:auto;padding:14px}.welcome{padding:20px;border-radius:17px;color:#fff;background:linear-gradient(120deg,var(--blue2),var(--blue) 58%,#4d177b)}.welcome small,.welcome strong,.welcome span{display:block}.welcome small{opacity:.82;font-size:.68rem;font-weight:850}.welcome strong{font-size:1.4rem;margin-top:5px}.welcome span{margin-top:5px;color:#dceafb;font-size:.75rem}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:11px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;min-height:82px}.stat span,.stat b,.stat small{display:block}.stat span{font-size:.64rem;color:var(--muted);font-weight:850}.stat b{margin-top:7px;color:var(--blue);font-size:1.25rem}.stat small{margin-top:3px;color:var(--muted);font-size:.58rem}.section-title{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:18px 2px 9px}.section-title h2{margin:0;font-size:1rem}.section-title span{font-size:.64rem;color:var(--muted);text-align:right}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{display:flex;flex-direction:column;min-height:112px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-decoration:none}.tile .ico{font-size:1.28rem}.tile b{margin-top:auto;font-size:.8rem}.tile small{margin-top:4px;color:var(--muted);font-size:.63rem;overflow-wrap:anywhere}.panel{display:none}.panel.active{display:block}.records{display:grid;gap:10px}.empty{padding:25px;text-align:center;border:1px dashed #cbd8e5;border-radius:12px;color:var(--muted);background:#fff}
.ticket-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.ticket-tab{min-height:55px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#536579;padding:6px 3px;font-size:.58rem;font-weight:900}.ticket-tab b{display:block;color:var(--blue);font-size:.84rem;margin-bottom:2px}.ticket-tab.on{border-color:var(--blue);background:#eaf4ff;color:var(--blue)}.ticket{position:relative;background:#fff;border:1px solid var(--line);border-left:6px solid #1295c3;border-radius:14px;padding:14px;overflow:hidden}.ticket h3{margin:0;padding-right:86px;font-size:.9rem}.ticket .name{margin-top:6px;font-weight:900;font-size:.84rem}.ticket .issue{margin-top:4px;color:#536579;font-size:.72rem;line-height:1.4}.badge{position:absolute;right:0;top:0;padding:8px 12px;border-radius:0 13px 0 12px;background:#e8f6fd;color:#075b8e;font-size:.58rem;font-weight:950}.badge.progress{background:#fff1dc;color:#985d00}.badge.closed{background:#e8f8ef;color:#0d704d}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chip{padding:5px 8px;border-radius:999px;background:#f1f4f8;color:#64758a;font-size:.58rem;font-weight:800}.assigned{padding:10px;border-radius:9px;background:#f7f9fc;color:#536579;font-size:.68rem}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions button,.actions a,.ticket-disclosure summary{display:inline-flex;align-items:center;justify-content:center;min-height:40px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--blue);font-size:.66rem;font-weight:900;padding:0 11px;text-decoration:none;cursor:pointer}.actions .claim{background:var(--ok);border-color:var(--ok);color:#fff}.actions .update{background:var(--blue);border-color:var(--blue);color:#fff}.actions .map{border-color:#8fc1e8;background:#eef7ff;color:#075cb5}.actions .call{border-color:#b9d9c9;background:#effaf4;color:#126247}.ticket-disclosure{margin-top:9px}.ticket-disclosure summary{width:max-content;list-style:none}.ticket-disclosure summary::-webkit-details-marker{display:none}.ticket-disclosure[open] summary{background:#edf6fd}.detail{margin-top:10px;padding:11px;border:1px solid #e4ebf2;border-radius:10px;background:#f9fbfd;color:#536579;font-size:.69rem;line-height:1.65;overflow-wrap:anywhere}.detail b{color:var(--ink)}.build{display:block;margin-top:8px;color:#94a3b8;font-size:.56rem}.profile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.profile b{display:block;font-size:1rem}.profile span{display:block;margin-top:5px;color:var(--muted);font-size:.75rem}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:70;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}.bottom button{border:0;background:transparent;color:#66788b;font-size:.62rem;font-weight:850;min-height:48px;border-radius:9px}.bottom button.active{color:var(--blue);background:#edf6fd}.bottom i{display:block;font-style:normal;font-size:1.12rem}.module-toolbar{position:fixed;top:64px;left:0;right:0;z-index:60;display:flex;align-items:center;gap:10px;height:58px;padding:9px 12px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 3px 10px #13324c14}.module-toolbar b{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.back{height:40px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:850}.frame{position:fixed;top:122px;left:0;right:0;width:100vw;height:calc(100dvh - 188px);border:0;background:var(--bg)}body.module-open{position:fixed;inset:0;height:100dvh;overflow:hidden}.shell.module-mode .content{position:fixed;inset:64px 0 66px;padding:0;overflow:hidden}.shell.module-mode .dashboard-head{display:none!important}@media(min-width:720px){.stats{grid-template-columns:repeat(5,minmax(0,1fr))}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.records{grid-template-columns:repeat(2,minmax(0,1fr))}.ticket-tabs{grid-column:1/-1}}@media(max-width:420px){.content{padding:11px}.top{padding-left:8px;padding-right:8px}.top img{width:96px}.ticket h3{padding-right:78px}.ticket-tab{font-size:.53rem}}
</style>

<body>
<section id="login" class="login"><div class="brand"><img src="assets/TechGeekPH%20-%20logo.png" alt="TechGeekPH"><h1>TechGeekPH</h1><p>Employee & Admin Operations App</p></div><div class="login-wrap"><form id="loginForm" class="card"><h2>Sign in</h2><p class="lead">Secure login for TechGeekPH staff.</p><div class="field"><label>Username or email</label><input id="identifier" required autocomplete="username"></div><div class="field"><label>Password / PIN</label><div class="pw"><input id="password" type="password" required autocomplete="current-password"><button id="showPw" class="showpw" type="button">Show</button></div></div><button id="loginBtn" class="primary">Sign in to TechGeekPH</button><div id="loginMsg" class="msg"></div></form></div></section>
<section id="shell" class="shell hidden"><header class="top"><img src="assets/TechGeekPH%20-%20logo.png" alt="TechGeekPH"><div class="userbox"><b id="topName"></b><span id="topRole"></span></div><button id="logout" class="logout" type="button">↪</button></header><main class="content"><div class="dashboard-head"><section class="welcome"><small id="welcomeRole"></small><strong id="welcomeName"></strong><span id="welcomeSub"></span></section><div id="stats" class="stats"></div></div><section id="home" class="panel active"><div class="section-title"><h2>Workspace</h2><span>Live operations</span></div><div id="menu" class="grid"></div></section><section id="modules" class="panel"><div class="section-title"><h2>All Modules</h2><span id="moduleHint"></span></div><div id="allModules" class="grid"></div></section><section id="tickets" class="panel"><div class="section-title"><h2>Tickets</h2><span>Open / In Progress / Closed</span></div><div id="ticketRecords" class="records"></div></section><section id="account" class="panel"><div class="section-title"><h2>Account</h2></div><div id="profile"></div></section><section id="module" class="panel"><div class="module-toolbar"><button id="back" class="back" type="button">← Back</button><b id="moduleTitle">Module</b></div><iframe id="frame" class="frame" title="TechGeekPH module" allow="camera; geolocation; clipboard-read; clipboard-write"></iframe></section></main><nav class="bottom" id="nav"><button class="active" data-panel="home"><i>⌂</i>Home</button><button data-panel="modules"><i>▦</i>Modules</button><button data-panel="tickets"><i>✓</i>Tickets</button><button data-panel="account"><i>●</i>Account</button></nav></section>
<script>
(function(){'use strict';
const BUILD='20260830-ticket-client-v7';
const BASE='https://tcexzfztdgximrzuosqs.supabase.co';
const KEY='sb_publishable_8H8_S7NTWvzPCLvYUe2C4g_k3Ltjfiz';
const STORE='tg_session_v3',SBSTORE='sb-tcexzfztdgximrzuosqs-auth-token',PORTAL='techgeekph_admin_session';
let session=null,profile=null,tickets=[],clients=[];
const $=id=>document.getElementById(id);
const EMP=[['app-attendance.html','⏱','Time In / Time Out','Attendance and breaks'],['app-tickets.html','✓','Technician Checklist','Repair, relocation and assigned ticket updates'],['application_form.html?form=install','＋','New Installation','New client application only'],['my_expense_request.html','₱','My Expenses','Expense requests'],['app-payslips.html','▥','Payslips','Payroll records']];
const ADMIN=[['application_form.html','＋','Application Form','Installation, repair and relocation'],['clients.html','👥','Clients','Client master records'],['client-data-quality.html','⚠','Data Quality','Incomplete client records to review'],['billing.html','₱','Billing Control','Billing and payments'],['tickets.html','🎫','Tickets Admin','Tickets, employee requests and service workflow'],['nap-checker.html','◉','NAP Checker','NAP ports and clients'],['expense_approval.html','₱','Expense Approval','Review staff expenses'],['payroll-loans.html','₱','Payroll & Loans','Payroll, employee payslips and loan management']];
function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function norm(v){return String(v||'').trim().toLowerCase()}
function role(){return String(profile&&profile.role||'').toUpperCase()}
function sameName(a,b){return norm(a).replace(/[^a-z0-9]/g,'')===norm(b).replace(/[^a-z0-9]/g,'')}
function canUpdateTicket(t){if(role()!=='EMPLOYEE'||ticketStage(t)!=='progress')return false;const mineById=String(t.assigned_employee_id||'')&&String(t.assigned_employee_id||'')===String(profile.employee_id||'');const mineByName=!t.assigned_employee_id&&sameName(t.assigned_tech,profile.full_name);return !!(mineById||mineByName)}
function saveSession(s){session=s;try{localStorage.setItem(STORE,JSON.stringify(s));localStorage.setItem(SBSTORE,JSON.stringify(s))}catch(_){}}
function clearSession(){session=null;try{localStorage.removeItem(STORE);localStorage.removeItem(SBSTORE);localStorage.removeItem(PORTAL)}catch(_){}}
async function refreshAuth(){if(!session||!session.refresh_token)return false;try{const r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;const s=await r.json();if(!s||!s.access_token)return false;saveSession(s);return true}catch(_){return false}}
async function request(path,opt,auth,retry){opt=opt||{};const headers=Object.assign({apikey:KEY,'Content-Type':'application/json'},opt.headers||{});if(auth!==false&&session&&session.access_token)headers.Authorization='Bearer '+session.access_token;const r=await fetch(BASE+path,Object.assign({},opt,{headers}));if(r.status===401&&auth!==false&&retry!==false&&await refreshAuth())return request(path,opt,auth,false);const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch(_){data=text}if(!r.ok)throw new Error(data&&data.message||data&&data.error_description||'Request failed '+r.status);return data}
async function resolveLogin(id){if(id.includes('@'))return id;const d=await request('/rest/v1/rpc/resolve_app_login',{method:'POST',body:JSON.stringify({p_identifier:id})},false);if(!d)throw new Error('Account not found.');return String(d)}
async function loadProfile(){const d=await request('/rest/v1/staff_profiles?select=*&user_id=eq.'+encodeURIComponent(session.user.id)+'&limit=1',{method:'GET'});profile=Array.isArray(d)&&d[0];if(!profile||!profile.active)throw new Error('Inactive account.');profile.role=String(profile.role||'').toUpperCase()}
function tile(x){return '<a class="tile" href="'+esc(x[0])+'" data-title="'+esc(x[2])+'"><span class="ico">'+x[1]+'</span><b>'+esc(x[2])+'</b><small>'+esc(x[3])+'</small></a>'}
function renderMenu(){let list=role()==='EMPLOYEE'?EMP.slice():ADMIN.slice();if(role()==='OWNER')list.push(['admin_accounts.html','⚙','User Accounts','Create, activate and reset staff accounts']);$('menu').innerHTML=$('allModules').innerHTML=list.map(tile).join('');$('moduleHint').textContent=list.length+' modules'}
function ticketStage(t){const s=norm(t.status);if(['done','resolved','closed','completed','cancelled','canceled'].includes(s))return'closed';if(['in progress','on going','ongoing','for checking','acknowledged','on the way','on site','diagnosing','for monitoring','assigned'].includes(s)||t.assigned_employee_id||String(t.assigned_tech||'').trim())return'progress';return'open'}
function normalizeMapLink(raw){const direct=String(raw||'').trim();if(!direct)return'';try{const decoded=decodeURIComponent(direct).replace(/°/g,'');const m=decoded.match(/[?&](?:q|query)=\s*(-?\d{1,2}(?:\.\d+)?)\s*[, ]\s*(-?\d{1,3}(?:\.\d+)?)/i);if(m){const lat=Number(m[1]),lng=Number(m[2]);if(lat>=-90&&lat<=90&&lng>=-180&&lng<=180)return 'https://www.google.com/maps/search/?api=1&query='+lat+','+lng}}catch(_){}return /^https?:\/\//i.test(direct)?direct:''}
function mapUrl(t){const direct=normalizeMapLink(t.google_maps_link);if(direct)return direct;const address=[t.rd_blk,t.address].filter(Boolean).join(' ').trim();return address?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(address):''}
function phoneUrl(v){const p=String(v||'').replace(/[^0-9+]/g,'');return p?'tel:'+p:''}
async function loadTickets(){try{const d=await request('/rest/v1/tech_ticket_public_queue?select=*&order=created_date.desc&order=ticket_no.desc&limit=500',{method:'GET'});if(Array.isArray(d))tickets=d}catch(e){console.warn('Ticket refresh failed',e);tickets=[]}renderTickets()}
function renderTickets(){const box=$('ticketRecords'),view=box.dataset.stage||'progress',open=tickets.filter(t=>ticketStage(t)==='open'),progress=tickets.filter(t=>ticketStage(t)==='progress'),closed=tickets.filter(t=>ticketStage(t)==='closed'),list=view==='all'?tickets:view==='open'?open:view==='closed'?closed:progress;const tabs='<div class="ticket-tabs"><button class="ticket-tab '+(view==='all'?'on':'')+'" type="button" data-stage="all"><b>'+tickets.length+'</b>ALL</button><button class="ticket-tab '+(view==='open'?'on':'')+'" type="button" data-stage="open"><b>'+open.length+'</b>OPEN</button><button class="ticket-tab '+(view==='progress'?'on':'')+'" type="button" data-stage="progress"><b>'+progress.length+'</b>IN PROGRESS</button><button class="ticket-tab '+(view==='closed'?'on':'')+'" type="button" data-stage="closed"><b>'+closed.length+'</b>CLOSED</button></div>';const cards=list.slice(0,150).map(ticketCard).join('');box.innerHTML=tabs+(cards||'<div class="empty">No '+(view==='progress'?'in-progress':view)+' tickets.</div>');box.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>{box.dataset.stage=b.dataset.stage;renderTickets()}));box.querySelectorAll('[data-claim]').forEach(b=>b.addEventListener('click',()=>claim(b.dataset.claim)));box.querySelectorAll('[data-update]').forEach(b=>b.addEventListener('click',()=>openTicketEditor(b.dataset.update)))}
function ticketCard(t){const sg=ticketStage(t),unassigned=!t.assigned_employee_id&&!String(t.assigned_tech||'').trim(),isEmp=role()==='EMPLOYEE',canUpdate=canUpdateTicket(t),mu=mapUrl(t),tel=phoneUrl(t.contact_number),service=[t.category,t.service_type,t.ticket_type].filter(Boolean).join(' / ')||'—';return '<article class="ticket"><span class="badge '+sg+'">'+(sg==='closed'?'CLOSED':sg==='progress'?'IN PROGRESS':'OPEN')+'</span><h3>'+esc(t.ticket_no||'Ticket')+'</h3><div class="name">'+esc(t.client_name||'—')+'</div><div class="issue">'+esc(t.issue_purpose||t.concern||t.ticket_type||'—')+'</div><div class="chips"><span class="chip">'+esc(t.priority||'Normal')+'</span><span class="chip">'+esc(t.created_date||'No date')+'</span></div><div class="assigned">Assigned: <b>'+esc(t.assigned_tech||'Unassigned')+'</b></div><details class="ticket-disclosure"><summary>Show Details</summary><div class="detail"><b>Account:</b> '+esc(t.client_account_no||'—')+'<br><b>Contact:</b> '+esc(t.contact_number||'—')+'<br><b>RD / BLK:</b> '+esc(t.rd_blk||'—')+'<br><b>Address:</b> '+esc(t.address||'—')+'<br><b>Service / Type:</b> '+esc(service)+'<br><b>Concern:</b> '+esc(t.concern||t.issue_purpose||'—')+'<br><b>Priority:</b> '+esc(t.priority||'Normal')+'<br><b>Schedule:</b> '+esc(t.schedule_date||'—')+'<br><b>Assigned Technician:</b> '+esc(t.assigned_tech||'Unassigned')+'<br><b>Admin Remarks:</b> '+esc(t.admin_remarks||'—')+'<br><b>Tech Remarks:</b> '+esc(t.tech_remarks||'—')+'<br><b>Resolution:</b> '+esc(t.resolution||'—')+(mu?'<br><b>Maps:</b> Location ready':'')+'</div></details><div class="actions">'+(isEmp&&sg==='open'&&unassigned?'<button class="claim" type="button" data-claim="'+esc(t.ticket_no)+'">GET THIS TICKET</button>':'')+(canUpdate?'<button class="update" type="button" data-update="'+esc(t.ticket_no)+'">✎ UPDATE TICKET</button>':'')+(mu?'<a class="map" href="'+esc(mu)+'">📍 Maps</a>':'')+(tel?'<a class="call" href="'+esc(tel)+'">📞 Call</a>':'')+'</div><small class="build">Ticket UI '+BUILD+'</small></article>'}
function openTicketEditor(no){$('moduleTitle').textContent='Update Ticket · '+no;$('frame').src='app-tickets.html?embed=1&ticket='+encodeURIComponent(no)+'&source=app-v7&t='+Date.now();activate('module')}
async function claim(no){if(!confirm('Get this ticket and assign it to you?'))return;try{await request('/rest/v1/rpc/claim_my_ticket',{method:'POST',body:JSON.stringify({p_ticket_no:no})});$('ticketRecords').dataset.stage='progress';await loadTickets()}catch(e){alert(e.message||'Unable to get ticket.')}}
function stat(x){return '<div class="stat"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b><small>'+esc(x[2])+'</small></div>'}
async function loadHome(){await loadTickets();if(role()==='EMPLOYEE'){$('stats').innerHTML=[['Open',tickets.filter(t=>ticketStage(t)==='open').length,'Team queue'],['My Tickets',tickets.filter(t=>String(t.assigned_employee_id||'')===String(profile.employee_id||'')).length,'Assigned to me'],['In Progress',tickets.filter(t=>ticketStage(t)==='progress').length,'Active'],['Closed',tickets.filter(t=>ticketStage(t)==='closed').length,'Completed']].map(stat).join('')}else{try{const d=await request('/rest/v1/clients?select=account_no,account_status&limit=1500',{method:'GET'});if(Array.isArray(d))clients=d}catch(_){}const active=clients.filter(c=>norm(c.account_status).startsWith('active')).length;$('stats').innerHTML=[['Total Clients',clients.length,'Client records'],['Active Clients',active,'Active accounts'],['Open',tickets.filter(t=>ticketStage(t)==='open').length,'New / unclaimed'],['In Progress',tickets.filter(t=>ticketStage(t)==='progress').length,'Assigned / active'],['Closed',tickets.filter(t=>ticketStage(t)==='closed').length,'Completed']].map(stat).join('')}}
function renderProfile(){$('profile').innerHTML='<div class="profile"><b>'+esc(profile.full_name||'Staff')+'</b><span>'+esc(role())+' · '+esc(profile.employee_id||profile.username||'TechGeekPH account')+'</span><span>Build: '+BUILD+'</span></div>'}
async function enter(s){session=s;await loadProfile();$('topName').textContent=profile.full_name;$('topRole').textContent=role();$('welcomeName').textContent='Hello, '+String(profile.full_name||'Staff').split(' ')[0];$('welcomeRole').textContent=role();$('welcomeSub').textContent=role()==='EMPLOYEE'?'New installations use the form; repair and relocation are updated inside assigned tickets.':'Full TechGeekPH operations access';renderMenu();renderProfile();$('login').classList.add('hidden');$('shell').classList.remove('hidden');await loadHome()}
function activate(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.panel===id));const mod=id==='module';$('shell').classList.toggle('module-mode',mod);document.body.classList.toggle('module-open',mod);if(!mod)$('frame').src='about:blank';if(id==='tickets')loadTickets();if(id==='account')renderProfile();if(!mod)window.scrollTo(0,0)}
$('loginForm').onsubmit=async e=>{e.preventDefault();const btn=$('loginBtn');btn.disabled=true;try{const email=await resolveLogin($('identifier').value.trim()),d=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password:$('password').value})},false);saveSession(d);await enter(d);$('loginMsg').className='msg'}catch(err){$('loginMsg').textContent=err.message||'Login failed.';$('loginMsg').className='msg show error'}finally{btn.disabled=false}};
$('showPw').onclick=()=>{$('password').type=$('password').type==='password'?'text':'password';$('showPw').textContent=$('password').type==='password'?'Show':'Hide'};$('logout').onclick=()=>{clearSession();location.reload()};document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>activate(b.dataset.panel));document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a.tile');if(!a)return;e.preventDefault();const href=a.getAttribute('href');$('moduleTitle').textContent=a.dataset.title;$('frame').src=href+(href.includes('?')?'&':'?')+'embed=1&source=app-v7&t='+Date.now();activate('module')});$('back').onclick=()=>activate('modules');window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.type==='tg-clients-changed')loadHome()});window.addEventListener('storage',e=>{if(e.key==='tg_clients_changed_at'&&role()!=='EMPLOYEE')loadHome()});
(async()=>{try{let s=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(SBSTORE)||'null');if(s&&s.access_token){session=s;await enter(s)}}catch(e){console.warn('Saved session restore failed',e);clearSession();$('login').classList.remove('hidden');$('shell').classList.add('hidden')}})();
})();
</script>
</body>
</html>
