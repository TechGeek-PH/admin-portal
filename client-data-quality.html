<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Client Data Quality</title><style>:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--blue:#064f83;--ink:#172438;--muted:#64748b;--line:#dbe4ee;--bg:#f3f6fa;--bad:#b42345}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}main{max-width:1050px;margin:auto;padding:14px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.head h1{margin:0;font-size:1.15rem}.head p{margin:4px 0 0;color:var(--muted);font-size:.75rem}.btn{min-height:40px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--blue);font-weight:850;padding:0 13px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px}.stat span{display:block;color:var(--muted);font-size:.65rem;font-weight:850}.stat b{display:block;margin-top:6px;color:var(--blue);font-size:1.35rem}.search{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px;margin-bottom:12px}.list{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-left:5px solid #d79b24;border-radius:12px;padding:13px}.card h2{margin:0;font-size:.9rem;color:var(--blue)}.card strong{display:block;margin-top:4px}.issues{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chip{padding:5px 8px;border-radius:999px;background:#fff0f3;color:var(--bad);font-size:.62rem;font-weight:850}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;font-size:.69rem;color:#536174}.empty{padding:30px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.error{padding:12px;border-radius:10px;background:#fff0f3;color:var(--bad);margin-bottom:12px}@media(max-width:620px){.summary{grid-template-columns:1fr 1fr}.meta{grid-template-columns:1fr}.head{align-items:flex-start}.head .btn{flex:0 0 auto}}</style></head><body><main><div class="head"><div><h1>Client Data Quality</h1><p>Admin review for incomplete or placeholder client master records.</p></div><button id="refresh" class="btn">↻ Refresh</button></div><div id="error"></div><div class="summary"><div class="stat"><span>Records to Review</span><b id="total">0</b></div><div class="stat"><span>Total Issues</span><b id="issues">0</b></div><div class="stat"><span>High Priority (3+)</span><b id="high">0</b></div></div><input id="search" class="search" placeholder="Search account, client, or issue"><div id="list" class="list"><div class="empty">Loading data quality checks…</div></div></main><script>(function(){'use strict';const BASE='https://tcexzfztdgximrzuosqs.supabase.co',KEY='sb_publishable_8H8_S7NTWvzPCLvYUe2C4g_k3Ltjfiz',STORE='tg_session_v3',SB='sb-tcexzfztdgximrzuosqs-auth-token';let rows=[];const $=id=>document.getElementById(id);function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));}function read(){try{return JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(SB)||'null')}catch(_){return null}}function save(s){try{localStorage.setItem(STORE,JSON.stringify(s));localStorage.setItem(SB,JSON.stringify(s))}catch(_){}}async function refreshSession(){const s=read();if(!s||!s.refresh_token)return null;const r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});if(!r.ok)return null;const n=await r.json();save(n);return n}async function rpc(retry){let s=read();if(!s||!s.access_token)s=await refreshSession();if(!s)throw new Error('Session expired. Please sign in again.');let r=await fetch(BASE+'/rest/v1/rpc/admin_client_data_quality',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:'{}'});if(r.status===401&&retry!==false){s=await refreshSession();if(s)return rpc(false)}const text=await r.text();let d;try{d=text?JSON.parse(text):[]}catch(_){d=[]}if(!r.ok)throw new Error(d&&d.message||'Unable to load data quality report.');return Array.isArray(d)?d:[]}function render(){const q=String($('search').value||'').trim().toLowerCase();const shown=rows.filter(r=>!q||[r.account_no,r.client_name,(r.issues||[]).join(' ')].join(' ').toLowerCase().includes(q));$('total').textContent=rows.length;$('issues').textContent=rows.reduce((a,r)=>a+Number(r.issue_count||0),0);$('high').textContent=rows.filter(r=>Number(r.issue_count||0)>=3).length;const list=$('list');if(!shown.length){list.innerHTML='<div class="empty">No matching incomplete client records.</div>';return}list.innerHTML=shown.map(r=>'<article class="card"><h2>'+esc(r.account_no)+'</h2><strong>'+esc(r.client_name||'No name')+'</strong><div class="issues">'+(r.issues||[]).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div><div class="meta"><div><b>Phone:</b> '+esc(r.phone||'—')+'</div><div><b>Address:</b> '+esc(r.service_address||'—')+'</div><div><b>Plan / Speed:</b> '+esc(r.plan||'—')+' / '+esc(r.speed||'—')+'</div><div><b>Status:</b> '+esc(r.account_status||'—')+' / '+esc(r.service_status||'—')+'</div></div></article>').join('')}async function load(){try{$('error').innerHTML='';rows=await rpc();render()}catch(e){$('error').innerHTML='<div class="error">'+esc(e.message)+'</div>';$('list').innerHTML='<div class="empty">Unable to load data.</div>'}}$('search').addEventListener('input',render);$('refresh').onclick=load;load()})();</script></body></html>
