<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#064f83">
<title>TechGeekPH Mobile</title>
<style>
html,body{margin:0;min-height:100%;background:#fff;font-family:Arial,sans-serif;color:#064f83}#stage{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}.logo{width:min(280px,72vw);height:auto}.spin{width:38px;height:38px;margin:24px auto;border:4px solid #dbe7f2;border-top-color:#064f83;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.msg{font-size:14px;color:#64748b;line-height:1.5}.retry{display:inline-block;margin-top:16px;padding:12px 18px;border-radius:10px;background:#064f83;color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div id="stage"><div><img class="logo" src="assets/TechGeekPH%20-%20logo.png" alt="TechGeekPH"><div class="spin"></div><div class="msg">Loading secure TechGeekPH login…</div></div></div>
<script>
(function(){
  var stage=document.getElementById('stage');
  var target='app.html?mobile=1&compat=1&v=1.2.2&t='+(new Date().getTime());
  function fail(text){
    if(!stage)return;
    stage.innerHTML='<div><img class="logo" src="assets/TechGeekPH%20-%20logo.png" alt="TechGeekPH"><h2>Unable to load TechGeekPH</h2><div class="msg">'+text+'</div><a class="retry" href="mobile-entry.html?t='+(new Date().getTime())+'">Retry</a></div>';
  }
  try{
    var xhr=new XMLHttpRequest();
    xhr.open('GET',target,true);
    xhr.setRequestHeader('Cache-Control','no-cache');
    xhr.onreadystatechange=function(){
      if(xhr.readyState!==4)return;
      if(xhr.status>=200&&xhr.status<300){
        var html=xhr.responseText||'';
        if(!html){fail('The app page returned no content.');return;}
        html=html.split("String(v??'')").join("String(v==null?'':v)");
        html=html.split("a.querySelector('b')?.textContent").join("((a.querySelector('b')&&a.querySelector('b').textContent)||'')");
        document.open();
        document.write(html);
        document.close();
      }else{
        fail('Network response '+xhr.status+'. Please check internet connection and try again.');
      }
    };
    xhr.onerror=function(){fail('Network connection failed. Please try again.');};
    xhr.send();
  }catch(e){fail(e&&e.message?e.message:'Unable to start the app.');}
})();
</script>
</body>
</html>
