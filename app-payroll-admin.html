<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#064f83"><title>TechGeekPH Payroll Admin</title><style>
:root{--b:#064f83;--b2:#023d6b;--p:#65187f;--ink:#172438;--m:#6b7a8e;--line:#dbe4ee;--bg:#f3f6fa;--ok:#16865e;--warn:#b7791f;--bad:#b42345;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}header img{width:104px;height:42px;object-fit:contain}.back{margin-left:auto;text-decoration:none;color:var(--b);font-size:.8rem;font-weight:900;border:1px solid var(--line);padding:9px 11px;border-radius:10px}.wrap{width:min(1050px,100%);margin:auto;padding:14px}.hero{padding:20px;border-radius:18px;color:#fff;background:linear-gradient(120deg,var(--b2),var(--b) 58%,var(--p))}.hero h1{margin:0;font-size:1.45rem}.hero p{margin:7px 0 0;color:#dceafb;font-size:.78rem}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.stat span,.stat b{display:block}.stat span{font-size:.65rem;color:var(--m);font-weight:900}.stat b{margin-top:6px;color:var(--b);font-size:1.18rem}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar select,.toolbar button{min-height:42px;border-radius:10px;padding:0 12px}.toolbar select{border:1px solid var(--line);background:#fff}.primary{border:0;background:var(--b);color:#fff;font-weight:900}.list{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.head{display:grid;grid-template-columns:1fr auto;gap:10px}.head b{font-size:.86rem}.sub{margin-top:4px;color:var(--m);font-size:.67rem}.money{text-align:right;color:var(--ok);font-weight:950}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.badge{padding:5px 8px;border-radius:999px;font-size:.58rem;font-weight:950}.draft{background:#fff7e5;color:#8a5a08}.unpaid{background:#fff0f3;color:var(--bad)}.paid{background:#eaf9f2;color:#0e7250}.unverified{background:#eef4ff;color:#31558d}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.meta div{background:#f8fafc;border-radius:9px;padding:8px;font-size:.64rem}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.actions button{min-height:36px;border-radius:9px;padding:0 10px;font-size:.7rem;font-weight:900}.ghost{border:1px solid var(--line);background:#fff;color:var(--b)}.ok{border:0;background:var(--ok);color:#fff}.warn{border:0;background:#b7791f;color:#fff}.danger{border:0;background:var(--bad);color:#fff}.empty{padding:24px;text-align:center;border:1px dashed #cbd8e5;border-radius:14px;background:#fff;color:var(--m);font-size:.75rem}.notice{display:none;margin:10px 0;padding:10px;border-radius:10px;font-size:.72rem}.notice.show{display:block}.notice.ok{background:#eefaf5;color:#126247}.notice.err{background:#fff0f3;color:#9a173a}dialog{width:min(620px,calc(100% - 18px));border:0;border-radius:16px;padding:0;box-shadow:0 24px 70px #001c3b50}dialog::backdrop{background:#03182b9e}.dh{display:flex;align-items:center;justify-content:space-between;padding:14px;background:var(--b);color:#fff}.dh h2{margin:0;font-size:1rem}.x{border:0;background:transparent;color:#fff;font-size:1.35rem}.db{padding:14px;max-height:70vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;margin-bottom:5px;font-size:.66rem;font-weight:900}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px}.field textarea{min-height:80px}.full{grid-column:1/-1}.da{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}.embed header{display:none}.embed .wrap{padding-top:12px}@media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}@media(max-width:600px){.meta{grid-template-columns:1fr 1fr}.head{grid-template-columns:1fr}.money{text-align:left}.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><img src="assets/TechGeekPH%20-%20logo.png"><a class="back" href="app.html">← App Home</a></header><main class="wrap"><section class="hero"><h1>Payroll Admin</h1><p>Cutoff 26–10 → salary 15 · Cutoff 11–25 → salary 30/31</p></section><section class="stats"><div class="stat"><span>TOTAL PAYSLIPS</span><b id="total">0</b></div><div class="stat"><span>DRAFT</span><b id="draft">0</b></div><div class="stat"><span>UNPAID / UNVERIFIED</span><b id="unpaid">0</b></div><div class="stat"><span>PAID</span><b id="paid">0</b></div></section><div id="notice" class="notice"></div><div class="toolbar"><select id="employee"><option value="">All Employees</option></select><select id="state"><option value="">All Status</option><option value="DRAFT">Draft</option><option value="FINALIZED">Finalized</option><option value="PAID">Paid</option><option value="UNPAID">Unpaid</option></select><button id="generate" class="primary" type="button">Generate Latest Closed Cutoff</button></div><section id="list" class="list"><div class="empty">Loading payroll…</div></section></main><dialog id="dlg"><div class="dh"><h2 id="dlgTitle">Adjust Payslip</h2><button id="close" class="x" type="button">×</button></div><div class="db"><div class="form"><div class="field"><label>Additional Pay</label><input id="additional" type="number" step="0.01"></div><div class="field"><label>Night Differential Pay</label><input id="nd" type="number" step="0.01"></div><div class="field"><label>Rest Day Pay</label><input id="rest" type="number" step="0.01"></div><div class="field"><label>RDOT Pay</label><input id="rdot" type="number" step="0.01"></div><div class="field"><label>Holiday Pay</label><input id="holiday" type="number" step="0.01"></div><div class="field"><label>Cash Advance Deduction</label><input id="cash" type="number" step="0.01"></div><div class="field"><label>Loan Deduction</label><input id="loan" type="number" step="0.01"></div><div class="field"><label>SSS</label><input id="sss" type="number" step="0.01"></div><div class="field"><label>PhilHealth</label><input id="ph" type="number" step="0.01"></div><div class="field"><label>Pag-IBIG</label><input id="pagibig" type="number" step="0.01"></div><div class="field"><label>Other Deduction</label><input id="other" type="number" step="0.01"></div><div class="field full"><label>Remarks</label><textarea id="remarks"></textarea></div></div></div><div class="da"><button id="cancel" class="ghost" type="button">Cancel</button><button id="save" class="primary" type="button">Save Adjustments</button></div></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js?v=20260822-payrolladmin1"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),db=window.TechGeekSupabase;let rows=[],selected=null;if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embed');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'₱'+(Number(v)||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});const date=v=>v?new Date(String(v).slice(0,10)+'T00:00:00+08:00').toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'}):'—';function note(t,k='ok'){const n=$('notice');n.textContent=t;n.className='notice show '+k;setTimeout(()=>n.className='notice',4500)}function badge(r){let s=r.workflow_status==='DRAFT'?'<span class="badge draft">DRAFT</span>':'<span class="badge unverified">FINALIZED</span>';s+=r.payment_status==='PAID'?'<span class="badge paid">PAID</span>':r.payment_status==='UNVERIFIED'?'<span class="badge unverified">PAYMENT UNVERIFIED</span>':'<span class="badge unpaid">UNPAID</span>';return s}function card(r){return `<article class="card"><div class="head"><div><b>${esc(r.employee_name)}</b><div class="sub">${esc(r.employee_id)} · Cutoff ${date(r.period_start)} – ${date(r.period_end)} · Salary ${date(r.salary_date)}</div></div><div class="money">${money(r.net_pay)}</div></div><div class="badges">${badge(r)}</div><div class="meta"><div><b>${Number(r.days_present||0)}</b><br>Days</div><div><b>${Number(r.total_work_hours||0).toFixed(2)}h</b><br>Work</div><div><b>${money(r.gross_pay)}</b><br>Gross</div><div><b>${money(r.total_deduction)}</b><br>Deductions</div></div>${r.payment_status==='PAID'?`<div class="sub" style="margin-top:9px">Paid by ${esc(r.paid_by_name||'Admin')} · ${esc(r.paid_at?new Date(r.paid_at).toLocaleString('en-PH',{timeZone:'Asia/Manila'}):'')}</div>`:''}<div class="actions"><button class="ghost" data-adjust="${esc(r.payslip_id)}">Adjust</button>${r.workflow_status==='DRAFT'?`<button class="warn" data-act="FINALIZE" data-id="${esc(r.payslip_id)}">Finalize</button>`:''}${r.workflow_status==='FINALIZED'&&r.payment_status!=='PAID'?`<button class="ok" data-act="PAID" data-id="${esc(r.payslip_id)}">Mark Paid</button>`:''}${r.payment_status==='PAID'?`<button class="danger" data-act="UNPAID" data-id="${esc(r.payslip_id)}">Undo Paid</button>`:''}</div></article>`}function render(){const e=$('employee').value,s=$('state').value;const list=rows.filter(r=>(!e||r.employee_id===e)&&(!s||(s==='PAID'?r.payment_status==='PAID':s==='UNPAID'?['UNPAID','UNVERIFIED'].includes(r.payment_status):r.workflow_status===s)));$('list').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No matching payroll records.</div>';document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.id,b.dataset.act));document.querySelectorAll('[data-adjust]').forEach(b=>b.onclick=()=>openAdjust(b.dataset.adjust))}async function load(){const q=await db.from('app_payslips').select('*').order('period_end',{ascending:false}).order('employee_name');if(q.error){$('list').innerHTML='<div class="empty">'+esc(q.error.message)+'</div>';return}rows=q.data||[];$('total').textContent=rows.length;$('draft').textContent=rows.filter(r=>r.workflow_status==='DRAFT').length;$('paid').textContent=rows.filter(r=>r.payment_status==='PAID').length;$('unpaid').textContent=rows.filter(r=>r.payment_status!=='PAID').length;const em=[...new Map(rows.map(r=>[r.employee_id,r.employee_name])).entries()];$('employee').innerHTML='<option value="">All Employees</option>'+em.map(([id,n])=>`<option value="${esc(id)}">${esc(n)}</option>`).join('');render()}async function act(id,a){if(!confirm(a==='PAID'?'Mark this payslip as PAID?':a==='UNPAID'?'Remove PAID status?':'Finalize this draft payslip?'))return;const r=await db.rpc('set_payslip_workflow',{p_payslip_id:id,p_action:a});if(r.error){note(r.error.message,'err');return}note(a==='PAID'?'Payslip marked Paid.':a==='FINALIZE'?'Payslip finalized.':'Paid status removed.');await load()}function openAdjust(id){selected=rows.find(r=>r.payslip_id===id);if(!selected)return;$('dlgTitle').textContent=selected.employee_name+' · '+date(selected.period_start)+'–'+date(selected.period_end);[['additional','additional_pay'],['nd','night_differential_pay'],['rest','rest_day_pay'],['rdot','rdot_pay'],['holiday','holiday_pay'],['cash','cash_advance_deduction'],['loan','loan_deduction'],['sss','sss_deduction'],['ph','philhealth_deduction'],['pagibig','pagibig_deduction'],['other','other_deduction']].forEach(([id,k])=>$(id).value=Number(selected[k]||0));$('remarks').value=selected.remarks||'';$('dlg').showModal()}async function saveAdjust(){if(!selected)return;const args={p_payslip_id:selected.payslip_id,p_additional_pay:+$('additional').value||0,p_night_differential_pay:+$('nd').value||0,p_rest_day_pay:+$('rest').value||0,p_rdot_pay:+$('rdot').value||0,p_holiday_pay:+$('holiday').value||0,p_cash_advance_deduction:+$('cash').value||0,p_loan_deduction:+$('loan').value||0,p_sss_deduction:+$('sss').value||0,p_philhealth_deduction:+$('ph').value||0,p_pagibig_deduction:+$('pagibig').value||0,p_other_deduction:+$('other').value||0,p_remarks:$('remarks').value.trim()||null};const r=await db.rpc('update_payslip_admin_values',args);if(r.error){note(r.error.message,'err');return}$('dlg').close();note('Payroll adjustments saved.');await load()}function latestClosed(){const d=new Date(),y=d.getFullYear(),m=d.getMonth(),day=d.getDate();let s,e,p;if(day>25){s=new Date(y,m,11);e=new Date(y,m,25);p=new Date(y,m+1,0)}else if(day>10){s=new Date(y,m-1,26);e=new Date(y,m,10);p=new Date(y,m,15)}else{s=new Date(y,m-1,11);e=new Date(y,m,0);p=new Date(y,m,0)}const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');return[iso(s),iso(e),iso(p)]}async function generate(){const [s,e,p]=latestClosed();const r=await db.rpc('generate_cutoff_payslip_drafts',{p_start:s,p_end:e,p_salary_date:p});if(r.error){note(r.error.message,'err');return}note((r.data||0)+' missing draft(s) generated for '+s+' to '+e+'.');await load()}async function boot(){if(!db){location.replace('app.html');return}const sess=(await db.auth.getSession()).data.session;if(!sess){location.replace('app.html');return}const p=await db.from('staff_profiles').select('role,active').eq('user_id',sess.user.id).maybeSingle();if(p.error||!p.data||!p.data.active||!['OWNER','ADMIN'].includes(p.data.role)){location.replace('app.html');return}await load()}$('employee').onchange=render;$('state').onchange=render;$('generate').onclick=generate;$('close').onclick=()=>$('dlg').close();$('cancel').onclick=()=>$('dlg').close();$('save').onclick=saveAdjust;boot()})();
</script></body></html>
