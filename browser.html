<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#064f83">
  <meta name="robots" content="noindex,nofollow">
  <title>TechGeekPH Browser App</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;color:#064f83;text-align:center;padding:24px;box-sizing:border-box}
    .brand{width:min(280px,72vw);height:auto}
    .spin{width:38px;height:38px;margin:24px auto 0;border:4px solid #dbe7f2;border-top-color:#064f83;border-radius:50%;animation:spin .8s linear infinite}
    .msg{margin-top:12px;color:#64748b;font-size:14px;line-height:1.5}
    .open{display:inline-block;margin-top:18px;padding:12px 18px;border-radius:10px;background:#064f83;color:#fff;text-decoration:none;font-weight:800}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main>
    <img class="brand" src="assets/TechGeekPH%20-%20logo.png" alt="TechGeekPH">
    <div class="spin"></div>
    <div class="msg">Opening the latest TechGeekPH app…</div>
    <a id="openApp" class="open" href="app.html?source=browser">Open TechGeekPH</a>
  </main>
  <script>
    (function(){
      var target='app.html?source=browser&live=1&t='+Date.now();
      document.getElementById('openApp').href=target;
      // Do not iframe the app. Using the real app page directly keeps browser behavior
      // identical to the installed Android/iOS shell and avoids nested module/session issues.
      window.location.replace(target);
    })();
  </script>
</body>
</html>
