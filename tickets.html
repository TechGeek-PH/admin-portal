<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#064f83">
  <title>TechGeekPH Tickets</title>
  <style>
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
    .boot{min-height:100%;display:grid;place-items:center;padding:24px}
    .card{width:min(440px,100%);padding:28px;border:1px solid #dce4ed;border-radius:14px;background:#fff;box-shadow:0 14px 38px rgba(14,34,55,.08);text-align:center}
    .mark{width:52px;height:52px;margin:0 auto 14px;display:grid;place-items:center;border-radius:50%;background:#064f83;color:#fff;font-weight:900}
    h1{margin:0;font-size:1.1rem}p{margin:8px 0 0;color:#64748b;font-size:.82rem;line-height:1.5}.error{color:#a42342}
  </style>
  <script src="assets/auth-session-bridge.js?v=20260818-4"></script>
</head>
<body>
  <main class="boot"><section class="card"><div class="mark">TG</div><h1>Opening Tickets…</h1><p id="status">Restoring your secure admin session.</p></section></main>
  <script>
  (async function () {
    "use strict";
    var status = document.getElementById("status");
    try {
      var session = await (window.TechGeekAuthReady || Promise.resolve(null));
      if (!session || !session.access_token) {
        window.location.replace("index.html?return=tickets.html&reason=login_required");
        return;
      }

      var response = await fetch("tickets-app.html?v=20260818-4", { cache: "no-store", credentials: "same-origin" });
      if (!response.ok) throw new Error("Tickets module could not be loaded (" + response.status + ").");
      var html = await response.text();

      // Load Supabase + the adapter before the legacy inline Tickets script.
      // Existing UI stays unchanged while all ticket/client reads and writes use Supabase.
      html = html.replace(
        '<script>\n    const BACKEND_URL',
        '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>\n' +
        '  <script src="assets/tickets-supabase-adapter.js?v=20260818-4"><\/script>\n' +
        '  <script>\n    const BACKEND_URL'
      );

      // A legacy backend error message must never destroy a valid Supabase admin session.
      html = html.replace(
        /function handleSessionFailure\(response\)\s*\{[\s\S]*?return false;\s*\}/,
        'function handleSessionFailure(response) {\n' +
        '  const message = response && response.message ? response.message : "";\n' +
        '  if (isSessionError(message)) {\n' +
        '    console.warn("Legacy ticket backend session message ignored; Supabase admin session remains active.", message);\n' +
        '    return false;\n' +
        '  }\n' +
        '  return false;\n' +
        '}'
      );

      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      console.error("Tickets bootstrap failed:", error);
      status.className = "error";
      status.textContent = "Unable to open Tickets. Please refresh the page or sign in again.";
    }
  })();
  </script>
</body>
</html>
