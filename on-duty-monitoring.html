<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#064f83"><title>On Duty Monitoring</title><style>
:root{--blue:#064f83;--blue2:#023d6b;--ink:#172438;--muted:#6b7a8e;--line:#dbe4ee;--bg:#f3f6fa;--ok:#16865e;--warn:#c47a00;--bad:#c81e4b;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}.wrap{max-width:1100px;margin:auto;padding:14px 14px 90px}.hero{background:linear-gradient(120deg,var(--blue2),var(--blue) 60%,#4d177b);color:#fff;border-radius:16px;padding:18px}.hero h1{margin:0;font-size:1.25rem}.hero p{margin:6px 0 0;color:#dceafb;font-size:.76rem;line-height:1.45}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 2px 9px}.head h2{margin:0;font-size:1rem}.btn{min-height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--blue);font-weight:900;padding:0 12px}.list{display:grid;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.emp{display:flex;justify-content:space-between;gap:12px}.emp h3{margin:0;font-size:1rem}.sub{margin-top:4px;color:var(--muted);font-size:.7rem}.chip{display:inline-flex;height:max-content;padding:5px 8px;border-radius:999px;font-size:.6rem;font-weight:900;background:#e9f7f1;color:var(--ok)}.chip.off{background:#f1f4f8;color:#64758a}.timeline{position:relative;margin-top:14px;padding-left:25px}.timeline:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:#dbe4ee}.event{position:relative;padding:0 0 15px}.event:last-child{padding-bottom:0}.dot{position:absolute;left:-22px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px #e7f2fb}.event.done .dot{background:var(--ok);box-shadow:0 0 0 4px #e6f6ef}.event.out .dot{background:#64758a;box-shadow:0 0 0 4px #eef1f4}.time{font-size:.65rem;color:var(--muted);font-weight:850}.title{margin-top:2px;font-size:.78rem;font-weight:900}.meta{margin-top:3px;font-size:.68rem;color:#596a7e;line-height:1.4}.ticketno{color:var(--blue)}.notice{margin:10px 0;padding:11px 12px;border-radius:10px;background:#fff4e5;color:#8a5700;font-size:.72rem}.notice.error{background:#fff0f4;color:#9d1741}.empty{padding:24px;text-align:center;border:1px dashed #cbd8e5;border-radius:12px;background:#fff;color:var(--muted);font-size:.75rem}</style></head><body>
<main class="wrap"><section class="hero"><h1>On Duty Employee Monitoring</h1><p>Shift timeline from Time In, ticket work and accomplishments, up to Time Out.</p></section><div id="notice" class="notice">Loading live monitoring data…</div><div class="head"><h2>Employees Today</h2><button id="refresh" class="btn" type="button">Refresh</button></div><section id="list" class="list"><div class="empty">Loading…</div></section></main>
<script>(function(){'use strict';
const BASE='https://tcexzfztdgximrzuosqs.supabase.co',KEY='sb_publishable_8H8_S7NTWvzPCLvYUe2C4g_k3Ltjfiz',STORE='tg_session_v3',SBSTORE='sb-tcexzfztdgximrzuosqs-auth-token';
const $=id=>document.getElementById(id);let session=null;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function getSession(){try{return JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(SBSTORE)||'null')}catch(_){return null}}
function tm(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?String(v):new Intl.DateTimeFormat('en-PH',{timeZone:'Asia/Manila',hour:'numeric',minute:'2-digit',hour12:true}).format(d)}
async function req(path,opt){opt=opt||{};const h={apikey:KEY,'Content-Type':'application/json'};if(session&&session.access_token)h.Authorization='Bearer '+session.access_token;const r=await fetch(BASE+path,Object.assign({},opt,{headers:h}));const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch(_){d=t}if(!r.ok)throw new Error((d&&d.message)||'Request failed '+r.status);return d}
function evHtml(e){let cls='',title='',meta='';if(e.event_type==='TIME_IN'){title='Time In';meta='Shift started';}else if(e.event_type==='TIME_OUT'){cls='out';title='Time Out';meta='Shift ended';}else if(e.event_type==='TICKET_CLAIMED'){title='<span class="ticketno">'+esc(e.ticket_no||'Ticket')+'</span> · Started';meta=e.account_no?'Account: '+esc(e.account_no):'New Installation · No account number yet';}else if(e.event_type==='TICKET_DONE'){cls='done';title='<span class="ticketno">'+esc(e.ticket_no||'Ticket')+'</span> · DONE';meta=e.account_no?'Account: '+esc(e.account_no):'New Installation · No account number yet';}else{title=esc(e.event_type||'Activity');meta=esc(e.status||'');}return '<div class="event '+cls+'"><span class="dot"></span><div class="time">'+esc(tm(e.event_at))+'</div><div class="title">'+title+'</div><div class="meta">'+meta+'</div></div>'}
function render(data){const rows=(data&&data.employees)||[];$('list').innerHTML=rows.length?rows.map(e=>{let events=Array.isArray(e.events)?e.events.slice():[];const hasIn=events.some(x=>x.event_type==='TIME_IN');const hasOut=events.some(x=>x.event_type==='TIME_OUT');if(!hasIn&&e.time_in)events.unshift({event_type:'TIME_IN',event_at:e.time_in});if(!hasOut&&e.time_out)events.push({event_type:'TIME_OUT',event_at:e.time_out});events.sort((a,b)=>new Date(a.event_at)-new Date(b.event_at));return '<article class="card"><div class="emp"><div><h3>'+esc(e.employee_name)+'</h3><div class="sub">Time In '+esc(tm(e.time_in))+(e.time_out?' · Time Out '+esc(tm(e.time_out)):' · Currently on duty')+'</div></div><span class="chip '+(e.time_out?'off':'')+'">'+(e.time_out?'OFF DUTY':'ON DUTY')+'</span></div><div class="timeline">'+(events.length?events.map(evHtml).join(''):'<div class="meta">No activity recorded yet.</div>')+'</div></article>'}).join(''):'<div class="empty">No employee attendance recorded today.</div>'}
async function load(){session=getSession();if(!session||!session.access_token){$('notice').className='notice error';$('notice').textContent='Admin App session not found. Return to the app and sign in again.';return}try{$('notice').style.display='block';$('notice').className='notice';$('notice').textContent='Refreshing shift timeline…';const d=await req('/rest/v1/rpc/admin_on_duty_timeline_today',{method:'POST',body:'{}'});render(d||{});$('notice').style.display='none'}catch(e){$('notice').style.display='block';$('notice').className='notice error';$('notice').textContent='Unable to load monitoring data. '+(e.message||e)}}
$('refresh').onclick=load;load();setInterval(load,60000);})();</script></body></html>
