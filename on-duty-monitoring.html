<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#064f83"><title>On Duty Monitoring</title><style>
:root{--blue:#064f83;--blue2:#023d6b;--ink:#172438;--muted:#6b7a8e;--line:#dbe4ee;--bg:#f3f6fa;--ok:#16865e;--warn:#c47a00;--bad:#c81e4b;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}.wrap{max-width:1100px;margin:auto;padding:14px 14px 90px}.hero{background:linear-gradient(120deg,var(--blue2),var(--blue) 60%,#4d177b);color:#fff;border-radius:16px;padding:18px}.hero h1{margin:0;font-size:1.25rem}.hero p{margin:6px 0 0;color:#dceafb;font-size:.76rem;line-height:1.45}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 0}.tab{min-height:42px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#5e6f83;font-weight:900}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}.panel{display:none}.panel.active{display:block}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 2px 9px}.head h2{margin:0;font-size:1rem}.btn{min-height:38px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--blue);font-weight:900;padding:0 12px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.active{background:#e7f2fb;border-color:#a9cce5}.list{display:grid;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}.emp{display:flex;justify-content:space-between;gap:12px}.emp h3{margin:0;font-size:1rem}.sub{margin-top:4px;color:var(--muted);font-size:.7rem}.chip{display:inline-flex;height:max-content;padding:5px 8px;border-radius:999px;font-size:.6rem;font-weight:900;background:#e9f7f1;color:var(--ok);white-space:nowrap}.chip.off,.chip.completed{background:#eef6f2;color:var(--ok)}.chip.incomplete{background:#fff4e5;color:#946000}.timeline{position:relative;margin-top:14px;padding-left:25px}.timeline:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:#dbe4ee}.event{position:relative;padding:0 0 15px}.event:last-child{padding-bottom:0}.dot{position:absolute;left:-22px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px #e7f2fb}.event.done .dot{background:var(--ok);box-shadow:0 0 0 4px #e6f6ef}.event.out .dot{background:#64758a;box-shadow:0 0 0 4px #eef1f4}.time{font-size:.65rem;color:var(--muted);font-weight:850}.title{margin-top:2px;font-size:.78rem;font-weight:900}.meta{margin-top:3px;font-size:.68rem;color:#596a7e;line-height:1.4}.ticketno{color:var(--blue)}.notice{margin:10px 0;padding:11px 12px;border-radius:10px;background:#fff4e5;color:#8a5700;font-size:.72rem}.notice.error{background:#fff0f4;color:#9d1741}.empty{padding:24px;text-align:center;border:1px dashed #cbd8e5;border-radius:12px;background:#fff;color:var(--muted);font-size:.75rem}.filters{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}.quick{display:flex;gap:8px;flex-wrap:wrap}.filter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.field label{display:block;margin:0 0 5px;font-size:.63rem;color:var(--muted);font-weight:850;text-transform:uppercase;letter-spacing:.04em}.field input{width:100%;min-height:40px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:#fff;color:var(--ink);font:inherit;font-size:.78rem}.dategroup{margin-top:14px}.datehead{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:0 2px 8px}.datehead h3{margin:0;font-size:.9rem}.datehead span{font-size:.66rem;color:var(--muted);font-weight:800}.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.summary span{font-size:.64rem;padding:5px 7px;border-radius:8px;background:#f4f7fa;color:#536579;font-weight:800}@media(max-width:650px){.filter-grid{grid-template-columns:1fr 1fr}.field.search{grid-column:1/-1}.emp{align-items:flex-start}.hero{border-radius:14px}}
</style></head><body>
<main class="wrap"><section class="hero"><h1>On Duty Employee Monitoring</h1><p>Live duty status plus historical Time In/Time Out, total hours and work activity per date.</p></section><div id="notice" class="notice">Loading live monitoring data…</div><div class="tabs"><button id="tabToday" class="tab active" type="button">On Duty Today</button><button id="tabHistory" class="tab" type="button">Duty History</button></div>
<section id="todayPanel" class="panel active"><div class="head"><h2>Employees Today</h2><button id="refreshToday" class="btn" type="button">Refresh</button></div><section id="todayList" class="list"><div class="empty">Loading…</div></section></section>
<section id="historyPanel" class="panel"><div class="filters"><div class="quick"><button id="yesterdayBtn" class="btn" type="button">Yesterday</button><button id="last7Btn" class="btn" type="button">Last 7 Days</button><button id="todayHistoryBtn" class="btn" type="button">Today</button></div><div class="filter-grid"><div class="field"><label for="fromDate">From</label><input id="fromDate" type="date"></div><div class="field"><label for="toDate">To</label><input id="toDate" type="date"></div><div class="field search"><label for="employeeSearch">Employee Search</label><input id="employeeSearch" type="search" placeholder="Search employee name"></div></div><div class="head" style="margin:10px 0 0"><div><h2>Duty History</h2><div id="rangeLabel" class="sub"></div></div><button id="applyHistory" class="btn primary" type="button">Apply</button></div></div><section id="historyList" class="list"><div class="empty">Select a date or range to view past duties.</div></section></section></main>
<script>(function(){'use strict';
const BASE='https://tcexzfztdgximrzuosqs.supabase.co',KEY='sb_publishable_8H8_S7NTWvzPCLvYUe2C4g_k3Ltjfiz',STORE='tg_session_v3',SBSTORE='sb-tcexzfztdgximrzuosqs-auth-token';
const $=id=>document.getElementById(id);let session=null,historyData=null,historyLoaded=false;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function getSession(){try{return JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(SBSTORE)||'null')}catch(_){return null}}
function tm(v){if(!v)return'—';const d=new Date(v);return isNaN(d)?String(v):new Intl.DateTimeFormat('en-PH',{timeZone:'Asia/Manila',hour:'numeric',minute:'2-digit',hour12:true}).format(d)}
function dateLabel(v){if(!v)return'';const d=new Date(v+'T12:00:00+08:00');return new Intl.DateTimeFormat('en-PH',{timeZone:'Asia/Manila',weekday:'short',month:'short',day:'numeric',year:'numeric'}).format(d)}
function phDate(offset){const now=new Date(Date.now()+(offset||0)*86400000);const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);const o={};parts.forEach(p=>{if(p.type!=='literal')o[p.type]=p.value});return o.year+'-'+o.month+'-'+o.day}
function duration(mins){if(mins==null||isNaN(mins))return'—';mins=Number(mins);const h=Math.floor(mins/60),m=mins%60;return h+'h '+String(m).padStart(2,'0')+'m'}
async function req(path,opt){opt=opt||{};const h={apikey:KEY,'Content-Type':'application/json'};if(session&&session.access_token)h.Authorization='Bearer '+session.access_token;const r=await fetch(BASE+path,Object.assign({},opt,{headers:h}));const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch(_){d=t}if(!r.ok)throw new Error((d&&d.message)||'Request failed '+r.status);return d}
function evHtml(e){let cls='',title='',meta='';if(e.event_type==='TIME_IN'){title='Time In';meta='Shift started';}else if(e.event_type==='TIME_OUT'){cls='out';title='Time Out';meta='Shift ended';}else if(e.event_type==='TICKET_CLAIMED'){title='<span class="ticketno">'+esc(e.ticket_no||'Ticket')+'</span> · Started';meta=e.account_no?'Account: '+esc(e.account_no):'New Installation · No account number yet';}else if(e.event_type==='TICKET_DONE'){cls='done';title='<span class="ticketno">'+esc(e.ticket_no||'Ticket')+'</span> · DONE';meta=e.account_no?'Account: '+esc(e.account_no):'New Installation · No account number yet';}else{title=esc(e.event_type||'Activity');meta=esc(e.status||'');}return '<div class="event '+cls+'"><span class="dot"></span><div class="time">'+esc(tm(e.event_at))+'</div><div class="title">'+title+'</div><div class="meta">'+meta+'</div></div>'}
function normalizedEvents(e){let events=Array.isArray(e.events)?e.events.slice():[];const hasIn=events.some(x=>x.event_type==='TIME_IN'),hasOut=events.some(x=>x.event_type==='TIME_OUT');if(!hasIn&&e.time_in)events.unshift({event_type:'TIME_IN',event_at:e.time_in});if(!hasOut&&e.time_out)events.push({event_type:'TIME_OUT',event_at:e.time_out});events.sort((a,b)=>new Date(a.event_at)-new Date(b.event_at));return events}
function renderToday(data){const rows=(data&&data.employees)||[];$('todayList').innerHTML=rows.length?rows.map(e=>{const events=normalizedEvents(e);return '<article class="card"><div class="emp"><div><h3>'+esc(e.employee_name)+'</h3><div class="sub">Time In '+esc(tm(e.time_in))+(e.time_out?' · Time Out '+esc(tm(e.time_out)):' · Currently on duty')+'</div></div><span class="chip '+(e.time_out?'off':'')+'">'+(e.time_out?'OFF DUTY':'ON DUTY')+'</span></div><div class="timeline">'+(events.length?events.map(evHtml).join(''):'<div class="meta">No activity recorded yet.</div>')+'</div></article>'}).join(''):'<div class="empty">No employee attendance recorded today.</div>'}
function historyCard(e){const events=normalizedEvents(e),status=String(e.status||'').toUpperCase(),cls=status==='INCOMPLETE'?'incomplete':status==='ON DUTY'?'':'completed';return '<article class="card"><div class="emp"><div><h3>'+esc(e.employee_name)+'</h3><div class="sub">Time In '+esc(tm(e.time_in))+' · Time Out '+esc(tm(e.time_out))+'</div><div class="summary"><span>Total: '+esc(duration(e.total_minutes))+'</span><span>'+events.filter(x=>x.event_type==='TICKET_DONE').length+' completed ticket(s)</span></div></div><span class="chip '+cls+'">'+esc(status||'COMPLETED')+'</span></div><div class="timeline">'+(events.length?events.map(evHtml).join(''):'<div class="meta">No activity recorded.</div>')+'</div></article>'}
function renderHistory(){const records=(historyData&&historyData.records)||[],q=$('employeeSearch').value.trim().toLowerCase(),filtered=q?records.filter(r=>String(r.employee_name||'').toLowerCase().includes(q)):records;if(!filtered.length){$('historyList').innerHTML='<div class="empty">No duty record found for this date range'+(q?' and employee search':'')+'.</div>';return}const groups={};filtered.forEach(r=>{(groups[r.attendance_date]||(groups[r.attendance_date]=[])).push(r)});$('historyList').innerHTML=Object.keys(groups).sort().reverse().map(d=>'<section class="dategroup"><div class="datehead"><h3>'+esc(dateLabel(d))+'</h3><span>'+groups[d].length+' employee'+(groups[d].length===1?'':'s')+'</span></div><div class="list">'+groups[d].map(historyCard).join('')+'</div></section>').join('')}
function setNotice(text,error){$('notice').style.display='block';$('notice').className='notice'+(error?' error':'');$('notice').textContent=text}
function clearNotice(){$('notice').style.display='none'}
async function loadToday(){session=getSession();if(!session||!session.access_token){setNotice('App session not found. Return to the TechGeekPH app and sign in again.',true);return}try{setNotice('Refreshing shift timeline…');const d=await req('/rest/v1/rpc/app_duty_timeline_today',{method:'POST',body:'{}'});renderToday(d||{});clearNotice()}catch(e){setNotice('Unable to load monitoring data. '+(e.message||e),true)}}
async function loadHistory(){session=getSession();if(!session||!session.access_token){setNotice('App session not found. Return to the TechGeekPH app and sign in again.',true);return}let from=$('fromDate').value,to=$('toDate').value;if(!from||!to){setNotice('Choose both From and To dates.',true);return}if(from>to){setNotice('From date cannot be later than To date.',true);return}try{setNotice('Loading duty history…');historyData=await req('/rest/v1/rpc/app_duty_history',{method:'POST',body:JSON.stringify({p_from_date:from,p_to_date:to})});historyLoaded=true;$('rangeLabel').textContent=dateLabel(from)+(from===to?'':' – '+dateLabel(to));renderHistory();clearNotice()}catch(e){setNotice('Unable to load duty history. '+(e.message||e),true)}}
function preset(type){const today=phDate(0),yesterday=phDate(-1);if(type==='yesterday'){$('fromDate').value=yesterday;$('toDate').value=yesterday}else if(type==='last7'){$('fromDate').value=phDate(-6);$('toDate').value=today}else{$('fromDate').value=today;$('toDate').value=today}loadHistory()}
function showTab(name){const today=name==='today';$('tabToday').classList.toggle('active',today);$('tabHistory').classList.toggle('active',!today);$('todayPanel').classList.toggle('active',today);$('historyPanel').classList.toggle('active',!today);if(!today&&!historyLoaded)loadHistory()}
const today=phDate(0),yesterday=phDate(-1);$('fromDate').max=today;$('toDate').max=today;$('fromDate').value=yesterday;$('toDate').value=yesterday;$('tabToday').onclick=()=>showTab('today');$('tabHistory').onclick=()=>showTab('history');$('refreshToday').onclick=loadToday;$('applyHistory').onclick=loadHistory;$('yesterdayBtn').onclick=()=>preset('yesterday');$('last7Btn').onclick=()=>preset('last7');$('todayHistoryBtn').onclick=()=>preset('today');$('employeeSearch').addEventListener('input',()=>{if(historyLoaded)renderHistory()});loadToday();setInterval(()=>{if($('todayPanel').classList.contains('active'))loadToday()},60000);})();</script></body></html>
