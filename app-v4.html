.78rem}.msg.show{display:block}.msg.error{background:#fff0f3;color:#a3153d}.shell{min-height:100dvh;padding-bottom:76px}.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;height:64px;padding:9px 12px;background:#fff;border-bottom:1px solid var(--line)}.top img{width:104px;max-width:34vw;height:42px;object-fit:contain}.userbox{margin-left:auto;text-align:right;max-width:48vw}.userbox b,.userbox span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.userbox b{font-size:.78rem}.userbox span{font-size:.64rem;color:var(--muted)}.logout{width:40px;height:40px;flex:0 0 40px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--red);font-size:18px}.content{width:100%;max-width:1100px;margin:auto;padding:14px}.welcome{padding:20px;border-radius:17px;color:#fff;background:linear-gradient(120deg,var(--blue2),var(--blue) 58%,#4d177b)}.welcome small,.welcome strong,.welcome span{display:block}.welcome small{opacity:.82;font-size:.68rem;font-weight:850}.welcome strong{font-size:1.4rem;margin-top:5px}.welcome span{margin-top:5px;color:#dceafb;font-size:.75rem}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:11px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;min-height:82px}.stat span,.stat b,.stat small{display:block}.stat span{font-size:.64rem;color:var(--muted);font-weight:850}.stat b{margin-top:7px;color:var(--blue);font-size:1.25rem}.stat small{margin-top:3px;color:var(--muted);font-size:.58rem}.section-title{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:18px 2px 9px}.section-title h2{margin:0;font-size:1rem}.section-title span{font-size:.64rem;color:var(--muted);text-align:right}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{display:flex;flex-direction:column;min-height:112px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);text-decoration:none}.tile .ico{font-size:1.28rem}.tile b{margin-top:auto;font-size:.8rem}.tile small{margin-top:4px;color:var(--muted);font-size:.63rem;overflow-wrap:anywhere}.panel{display:none}.panel.active{display:block}.records{display:grid;gap:10px}.empty{padding:25px;text-align:center;border:1px dashed #cbd8e5;border-radius:12px;color:var(--muted);background:#fff}.ticket-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.ticket-tab{min-height:55px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#536579;padding:6px 3px;font-size:.58rem;font-weight:900}.ticket-tab b{display:block;color:var(--blue);font-size:.84rem;margin-bottom:2px}.ticket-tab.on{border-color:var(--blue);background:#eaf4ff;color:var(--blue)}.ticket{position:relative;background:#fff;border:1px solid var(--line);border-left:6px solid #1295c3;border-radius:14px;padding:14px;overflow:hidden}.ticket h3{margin:0;padding-right:86px;font-size:.9rem}.ticket .name{margin-top:6px;font-weight:900;font-size:.84rem}.ticket .issue{margin-top:4px;color:#536579;font-size:.72rem;line-height:1.4}.badge{position:absolute;right:0;top:0;padding:8px 12px;border-radius:0 13px 0 12px;background:#e8f6fd;color:#075b8e;font-size:.58rem;font-weight:950}.badge.progress{background:#fff1dc;color:#985d00}.badge.closed{background:#e8f8ef;color:#0d704d}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chip{padding:5px 8px;border-radius:999px;background:#f1f4f8;color:#64758a;font-size:.58rem;font-weight:800}.assigned{padding:10px;border-radius:9px;background:#f7f9fc;color:#536579;font-size:.68rem}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions button{min-height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--blue);font-size:.64rem;font-weight:900;padding:0 10px}.actions .claim{background:var(--ok);border-color:var(--ok);color:#fff}.detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:#536579;font-size:.68rem;line-height:1.55}.profile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.profile b{display:block;font-size:1rem}.profile span{display:block;margin-top:5px;color:var(--muted);font-size:.75rem}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:70;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}.bottom button{border:0;background:transparent;color:#66788b;font-size:.62rem;font-weight:850;min-height:48px;border-radius:9px}.bottom button.active{color:var(--blue);background:#edf6fd}.bottom i{display:block;font-style:normal;font-size:1.12rem}.module-toolbar{position:fixed;top:64px;left:0;right:0;z-index:60;display:flex;align-items:center;gap:10px;height:58px;padding:9px 12px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 3px 10px #13324c14}.module-toolbar b{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.back{height:40px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:850}.frame{position:fixed;top:122px;left:0;right:0;width:100vw;height:calc(100dvh - 188px);border:0;background:var(--bg)}body.module-open{position:fixed;inset:0;height:100dvh;overflow:hidden}.shell.module-mode .content{position:fixed;inset:64px 0 66px;padding:0;overflow:hidden}.shell.module-mode .dashboard-head{display:none!important}@media(min-width:720px){.stats{grid-template-columns:repeat(5,minmax(0,1fr))}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:420px){.content{padding:11px}.top{padding-left:8px;padding-right:8px}.top img{width:96px}.ticket h3{padding-right:78px}.ticket-tab{font-size:.53rem}}</style></head><body><section id="login" class="login"><div class="brand"><img src="assets/TechGeekPH%20-%20logo.png" alt="TechGeekPH"><h1>TechGeekPH</h1><p>Employee & Admin Operations App</p></div><div class="login-wrap"><form id="loginForm" class="card"><h2>Sign in</h2><p class="lead">Secure login for TechGeekPH staff.</p><div class="field"><label>Username or email</label><input id="identifier" required autocomplete="username"></div><div class="field"><label>Password / PIN</label><div class="pw"><input id="password" type="password" required autocomplete="current-password"><button id="showPw" class="showpw" type="button">Show</button></div></div><button id="loginBtn" class="primary">Sign in to TechGeekPH</button><div id="loginMsg" class="msg"></div></form></div></section><section id="shell" class="shell hidden"><header class="top"><img src="assets/TechGeekPH%20-%20logo.png"><div class="userbox"><b id="topName"></b><span id="topRole"></span></div><button id="logout" class="logout">↪</button></header><main class="content"><div class="dashboard-head"><section class="welcome"><small id="welcomeRole"></small><strong id="welcomeName"></strong><span id="welcomeSub"></span></section><div id="stats" class="stats"></div></div><section id="home" class="panel active"><div class="section-title"><h2>Workspace</h2><span>Live operations</span></div><div id="menu" class="grid"></div></section><section id="modules" class="panel"><div class="section-title"><h2>All Modules</h2><span id="moduleHint"></span></div><div id="allModules" class="grid"></div></section><section id="tickets" class="panel"><div class="section-title"><h2>Tickets</h2><span>Open / In Progress / Closed</span></div><div id="ticketRecords" class="records"></div></section><section id="account" class="panel"><div class="section-title"><h2>Account</h2></div><div id="profile"></div></section><section id="module" class="panel"><div class="module-toolbar"><button id="back" class="back">← Back</button><b id="moduleTitle">Module</b></div><iframe id="frame" class="frame"></iframe></section></main><nav class="bottom" id="nav"><button class="active" data-panel="home"><i>⌂</i>Home</button><button data-panel="modules"><i>▦</i>Modules</button><button data-panel="tickets"><i>✓</i>Tickets</button><button data-panel="account"><i>●</i>Account</button></nav></section><script>(function(){'use strict';const BASE='https://tcexzfztdgximrzuosqs.supabase.co',KEY='sb_publishable_8H8_S7NTWvzPCLvYUe2C4g_k3Ltjfiz',STORE='tg_session_v3',SBSTORE='sb-tcexzfztdgximrzuosqs-auth-token',PORTAL='techgeekph_admin_session';let session=null,profile=null,tickets=[],clients=[];const $=id=>document.getElementById(id);const EMP=[['app-attendance.html','⏱','Time In / Time Out','Attendance and breaks'],['app-tickets.html','✓','Technician Checklist','Assigned tickets and checklist'],['application_form.html?form=install','＋','New Installation','New client application'],['application_form.html?form=repair','🛠','Repair Form','Existing client repair request'],['application_form.html?form=relocation','↔','Relocation Form','Existing client transfer request'],['my_expense_request.html','₱','My Expenses','Expense requests'],['app-payslips.html','▥','Payslips','Payroll records']];const ADMIN=[['application_form.html','＋','Application Form','Installation, repair and relocation'],['clients.html','👥','Clients','Client master records'],['client-data-quality.html','⚠','Data Quality','Incomplete client records to review'],['billing.html','₱','Billing Control','Billing and payments'],['tickets.html','🎫','Tickets Admin','Tickets, employee requests and service workflow'],['nap-checker.html','◉','NAP Checker','NAP ports and clients'],['expense_approval.html','₱','Expense Approval','Review staff expenses'],['loan_management.html','₱','Loan Management','Employee loan deductions'],['admin-employee-payslips.html','▥','Employee Payslips','All employee payroll records'],['app-payroll-admin.html','₱','Payroll Admin','Generate and finalize payroll']];function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));}function norm(v){return String(v||'').trim().toLowerCase()}function role(){return String(profile&&profile.role||'').toUpperCase()}function saveSession(s){session=s;try{localStorage.setItem(STORE,JSON.stringify(s));localStorage.setItem(SBSTORE,JSON.stringify(s))}catch(_){}}function clearSession(){session=null;try{localStorage.removeItem(STORE);localStorage.removeItem(SBSTORE);localStorage.removeItem(PORTAL)}catch(_){}}async function refreshAuth(){if(!session||!session.refresh_token)return false;try{const r=await fetch(BASE+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok)return false;const s=await r.json();if(!s||!s.access_token)return false;saveSession(s);return true}catch(_){return false}}async function request(path,opt,auth,retry){opt=opt||{};const headers=Object.assign({apikey:KEY,'Content-Type':'application/json'},opt.headers||{});if(auth!==false&&session&&session.access_token)headers.Authorization='Bearer '+session.access_token;const r=await fetch(BASE+path,Object.assign({},opt,{headers}));if(r.status===401&&auth!==false&&retry!==false&&await refreshAuth())return request(path,opt,auth,false);const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch(_){data=text}if(!r.ok)throw new Error(data&&data.message||'Request failed '+r.status);return data}async function resolveLogin(id){if(id.includes('@'))return id;const d=await request('/rest/v1/rpc/resolve_app_login',{method:'POST',body:JSON.stringify({p_identifier:id})},false);if(!d)throw new Error('Account not found.');return String(d)}async function loadProfile(){const d=await request('/rest/v1/staff_profiles?select=*&user_id=eq.'+encodeURIComponent(session.user.id)+'&limit=1',{method:'GET'});profile=Array.isArray(d)&&d[0];if(!profile||!profile.active)throw new Error('Inactive account.');profile.role=String(profile.role||'').toUpperCase()}function tile(x){return '<a class="tile" href="'+esc(x[0])+'" data-title="'+esc(x[2])+'"><span class="ico">'+x[1]+'</span><b>'+esc(x[2])+'</b><small>'+esc(x[3])+'</small></a>'}function renderMenu(){const list=role()==='EMPLOYEE'?EMP:ADMIN;$('menu').innerHTML=$('allModules').innerHTML=list.map(tile).join('');$('moduleHint').textContent=list.length+' modules'}function ticketStage(t){const s=norm(t.status);if(['done','resolved','closed','completed','cancelled','canceled'].includes(s))return'closed';if(['in progress','on going','ongoing','for checking','acknowledged','on the way','on site','diagnosing','for monitoring','assigned'].includes(s)||t.assigned_employee_id||String(t.assigned_tech||'').trim())return'progress';return'open'}async function loadTickets(){try{const path=role()==='EMPLOYEE'?'/rest/v1/tech_ticket_public_queue?select=*&order=created_date.desc&limit=500':'/rest/v1/support_tickets?select=*&order=created_date.desc&order=ticket_no.desc&limit=500';const d=await request(path,{method:'GET'});if(Array.isArray(d))tickets=d}catch(e){console.warn('Ticket refresh failed',e)}renderTickets()}function bindTabs(){document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{$('ticketRecords').dataset.stage=b.dataset.stage;renderTickets()})}function renderTickets(){const box=$('ticketRecords'),view=box.dataset.stage||'open',open=tickets.filter(t=>ticketStage(t)==='open'),progress=tickets.filter(t=>ticketStage(t)==='progress'),closed=tickets.filter(t=>ticketStage(t)==='closed'),list=view==='all'?tickets:view==='progress'?progress:view==='closed'?closed:open;const tabs='<div class="ticket-tabs"><button class="ticket-tab '+(view==='all'?'on':'')+'" data-stage="all"><b>'+tickets.length+'</b>ALL</button><button class="ticket-tab '+(view==='open'?'on':'')+'" data-stage="open"><b>'+open.length+'</b>OPEN</button><button class="ticket-tab '+(view==='progress'?'on':'')+'" data-stage="progress"><b>'+progress.length+'</b>IN PROGRESS</button><button class="ticket-tab '+(view==='closed'?'on':'')+'" data-stage="closed"><b>'+closed.length+'</b>CLOSED</button></div>';const cards=list.slice(0,120).map(t=>{const sg=ticketStage(t),unassigned=!t.assigned_employee_id&&!String(t.assigned_tech||'').trim(),isEmp=role()==='EMPLOYEE';return '<article class="ticket"><span class="badge '+sg+'">'+(sg==='closed'?'CLOSED':sg==='progress'?'IN PROGRESS':'OPEN')+'</span><h3>'+esc(t.ticket_no)+'</h3><div class="name">'+esc(t.client_name||'—')+'</div><div class="issue">'+esc(t.issue_purpose||t.concern||t.ticket_type||'—')+'</div><div class="chips"><span class="chip">'+esc(t.priority||'Normal')+'</span><span class="chip">'+esc(t.created_date||'No date')+'</span></div><div class="assigned">Assigned: <b>'+esc(t.assigned_tech||'Unassigned')+'</b></div><div class="actions">'+(isEmp&&sg==='open'&&unassigned?'<button class="claim" data-claim="'+esc(t.ticket_no)+'">GET THIS TICKET</button>':'')+'<button data-detail="'+esc(t.ticket_no)+'">Show Details</button></div><div class="detail hidden" id="d-'+esc(t.ticket_no)+'"><b>Account:</b> '+esc(t.client_account_no||'—')+'<br><b>Contact:</b> '+esc(t.contact_number||'—')+'<br><b>Address:</b> '+esc(t.address||'—')+'<br><b>Category:</b> '+esc(t.category||t.ticket_type||'—')+'<br><b>Concern:</b> '+esc(t.concern||t.issue_purpose||'—')+'<br><b>Tech Remarks:</b> '+esc(t.tech_remarks||'—')+'<br><b>Resolution:</b> '+esc(t.resolution||'—')+'</div></article>'}).join('');box.innerHTML=tabs+(cards||'<div class="empty">No '+(view==='progress'?'in-progress':view)+' tickets.</div>');bindTabs();box.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>claim(b.dataset.claim));box.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{const d=$('d-'+b.dataset.detail);if(!d)return;d.classList.toggle('hidden');b.textContent=d.classList.contains('hidden')?'Show Details':'Hide Details'})}async function claim(no){if(!confirm('Get this ticket and assign it to you?'))return;try{await request('/rest/v1/rpc/claim_my_ticket',{method:'POST',body:JSON.stringify({p_ticket_no:no})});await loadTickets()}catch(e){alert(e.message)}}function stat(x){return '<div class="stat"><span>'+x[0]+'</span><b>'+x[1]+'</b><small>'+x[2]+'</small></div>'}async function loadHome(){await loadTickets();if(role()==='EMPLOYEE'){$('stats').innerHTML=[['Open',tickets.filter(t=>ticketStage(t)==='open').length,'Team queue'],['My Tickets',tickets.filter(t=>String(t.assigned_employee_id||'')===String(profile.employee_id||'')).length,'Assigned to me'],['In Progress',tickets.filter(t=>ticketStage(t)==='progress').length,'Active'],['Closed',tickets.filter(t=>ticketStage(t)==='closed').length,'Completed']].map(stat).join('')}else{try{const d=await request('/rest/v1/clients?select=account_no,account_status&limit=1500',{method:'GET'});if(Array.isArray(d))clients=d}catch(_){}const active=clients.filter(c=>norm(c.account_status).startsWith('active')).length;$('stats').innerHTML=[['Total Clients',clients.length,'Client records'],['Active Clients',active,'Active accounts'],['Open',tickets.filter(t=>ticketStage(t)==='open').length,'New / unclaimed'],['In Progress',tickets.filter(t=>ticketStage(t)==='progress').length,'Assigned / active'],['Closed',tickets.filter(t=>ticketStage(t)==='closed').length,'Completed']].map(stat).join('')}}function renderProfile(){$('profile').innerHTML='<div class="profile"><b>'+esc(profile.full_name||'Staff')+'</b><span>'+esc(role())+' · '+esc(profile.employee_id||profile.username||'TechGeekPH account')+'</span></div>'}async function enter(s){session=s;await loadProfile();$('topName').textContent=profile.full_name;$('topRole').textContent=role();$('welcomeName').textContent='Hello, '+String(profile.full_name||'Staff').split(' ')[0];$('welcomeRole').textContent=role();$('welcomeSub').textContent=role()==='EMPLOYEE'?'Your field service and employee workspace':'Full TechGeekPH operations access';renderMenu();renderProfile();$('login').classList.add('hidden');$('shell').classList.remove('hidden');await loadHome()}function activate(id){document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.panel===id));const mod=id==='module';$('shell').classList.toggle('module-mode',mod);document.body.classList.toggle('module-open',mod);if(!mod)$('frame').src='about:blank';if(id==='tickets')loadTickets();if(id==='account')renderProfile();if(!mod)window.scrollTo(0,0)}$('loginForm').onsubmit=async e=>{e.preventDefault();const btn=$('loginBtn');btn.disabled=true;try{const email=await resolveLogin($('identifier').value.trim()),d=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password:$('password').value})},false);saveSession(d);await enter(d);$('loginMsg').className='msg'}catch(err){$('loginMsg').textContent=err.message;$('loginMsg').className='msg show error'}finally{btn.disabled=false}};$('showPw').onclick=()=>{$('password').type=$('password').type==='password'?'text':'password'};$('logout').onclick=()=>{clearSession();location.reload()};document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>activate(b.dataset.panel));document.addEventListener('click',e=>{const a=e.target.closest('a.tile');if(!a)return;e.preventDefault();const href=a.getAttribute('href');$('moduleTitle').textContent=a.dataset.title;$('frame').src=href+(href.includes('?')?'&':'?')+'embed=1&source=app-embed&t='+Date.now();activate('module')});$('back').onclick=()=>activate('modules');window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data&&e.data.type==='tg-clients-changed')loadHome()});window.addEventListener('storage',e=>{if(e.key==='tg_clients_changed_at'&&role()!=='EMPLOYEE')loadHome()});(async()=>{try{let s=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem(SBSTORE)||'null');if(s&&s.access_token){session=s;await enter(s)}}catch(e){console.warn('Saved session restore failed',e);clearSession();$('login').classList.remove('hidden');$('shell').classList.add('hidden')}})();})();</script></body></html>
