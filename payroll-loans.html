<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#064f83">
<meta name="robots" content="noindex,nofollow">
<title>TechGeekPH Payroll & Loans</title>
<style>
:root{--b:#064f83;--b2:#023d6b;--p:#65187f;--ink:#172438;--m:#6b7a8e;--line:#dbe4ee;--bg:#f3f6fa;--ok:#16865e;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box;min-width:0}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}button,a{font:inherit}.top{height:58px;display:flex;align-items:center;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}.top img{width:104px;height:40px;object-fit:contain}.back{margin-left:auto;text-decoration:none;color:var(--b);font-size:.76rem;font-weight:900;border:1px solid var(--line);padding:8px 10px;border-radius:9px}.shell{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}.intro{padding:10px 12px;background:linear-gradient(110deg,var(--b2),var(--b) 62%,var(--p));color:#fff}.intro strong{display:block;font-size:.95rem}.intro span{display:block;margin-top:3px;color:#dceafb;font-size:.66rem;line-height:1.4}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;padding:8px;background:#fff;border-bottom:1px solid var(--line)}.tab{min-height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#536579;font-size:.68rem;font-weight:900;padding:5px 7px}.tab b{display:block;font-size:.78rem;color:var(--b);margin-bottom:2px}.tab.on{border-color:var(--b);background:#edf6fd;color:var(--b);box-shadow:inset 0 0 0 1px #064f8320}.workspace{position:relative;min-height:0;background:var(--bg)}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}.loading{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:var(--bg);color:var(--m);font-size:.75rem;z-index:2}.loading.hidden{display:none}.error{color:#a3153d}.embed .top{display:none}.embed .shell{grid-template-rows:auto auto minmax(0,1fr)}@media(max-width:480px){.intro{padding:8px 10px}.intro strong{font-size:.86rem}.intro span{font-size:.61rem}.tabs{gap:5px;padding:6px}.tab{min-height:48px;font-size:.6rem;padding:4px}.tab b{font-size:.7rem}}@media(max-width:350px){.tab b{font-size:.64rem}.tab{font-size:.54rem}}
</style>
</head>
<body>
<header class="top"><img src="assets/TechGeekPH%20-%20logo.png" alt="TechGeekPH"><a class="back" href="app.html">← App Home</a></header>
<main class="shell">
<section class="intro"><strong>Payroll & Loans</strong><span>One workspace for payroll processing, employee payslip review, and loan management. Each tab reloads live data when opened.</span></section>
<nav class="tabs" aria-label="Payroll workspace sections">
<button class="tab" type="button" data-tab="payroll"><b>₱ Payroll Admin</b>Compute & finalize</button>
<button class="tab" type="button" data-tab="payslips"><b>▥ Payslips</b>Review & print</button>
<button class="tab" type="button" data-tab="loans"><b>↔ Loan Management</b>Loans & deductions</button>
</nav>
<section class="workspace"><div id="loading" class="loading">Opening payroll workspace…</div><iframe id="frame" title="Payroll workspace module"></iframe></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js?v=20260825-payrollhub2"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),db=window.TechGeekSupabase,frame=$('frame'),loading=$('loading');
const TABS={payroll:{title:'Payroll Admin',url:'app-payroll-admin.html'},payslips:{title:'Employee Payslips',url:'admin-employee-payslips.html'},loans:{title:'Loan Management',url:'loan_management.html'}};
if(new URLSearchParams(location.search).get('embed')==='1'||window.parent!==window)document.body.classList.add('embed');
function activeName(){const q=new URLSearchParams(location.search).get('tab');return TABS[q]?q:'payroll'}
function mark(tab,writeUrl){document.querySelectorAll('[data-tab]').forEach(b=>{const on=b.dataset.tab===tab;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'page':'false')});if(writeUrl){const u=new URL(location.href);u.searchParams.set('tab',tab);history.replaceState(null,'',u.pathname+'?'+u.searchParams.toString())}}
function show(tab,push=true){if(!TABS[tab])tab='payroll';mark(tab,push);loading.textContent='Loading '+TABS[tab].title+'…';loading.className='loading';frame.src=TABS[tab].url+'?embed=1&source=payroll-hub&t='+Date.now()}
function syncFromFrame(){try{const path=frame.contentWindow.location.pathname.split('/').pop();const found=Object.entries(TABS).find(([,v])=>v.url===path);if(found)mark(found[0],true)}catch(_){}}
async function boot(){try{if(!db)throw new Error('Supabase connection is unavailable.');const s=(await db.auth.getSession()).data.session;if(!s){location.replace('app.html');return}const p=await db.from('staff_profiles').select('role,active').eq('user_id',s.user.id).maybeSingle();if(p.error)throw p.error;if(!p.data||!p.data.active||!['OWNER','ADMIN'].includes(String(p.data.role||'').toUpperCase())){location.replace('app.html');return}show(activeName(),false)}catch(e){loading.textContent=e.message||'Unable to open Payroll & Loans.';loading.className='loading error'}}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab,true)));frame.addEventListener('load',()=>{syncFromFrame();loading.className='loading hidden'});window.addEventListener('pageshow',e=>{if(e.persisted)show(activeName(),false)});boot();
})();
</script>
</body>
</html>
