<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#064f83">
<title>TechGeekPH My Payslips</title>
<style>
:root{--b:#064f83;--b2:#023d6b;--r:#d60736;--p:#65187f;--ink:#172438;--m:#6b7a8e;--line:#dbe4ee;--bg:#f3f6fa;--ok:#16865e;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}button,select{font:inherit}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}header img{width:104px;height:42px;object-fit:contain}.back{margin-left:auto;text-decoration:none;color:var(--b);font-size:.8rem;font-weight:900;border:1px solid var(--line);padding:9px 11px;border-radius:10px}.wrap{width:min(900px,100%);margin:auto;padding:14px}.hero{padding:20px;border-radius:18px;color:#fff;background:linear-gradient(120deg,var(--b2),var(--b) 58%,var(--p));box-shadow:0 12px 28px #063c6b20}.hero h1{margin:0;font-size:1.45rem}.hero p{margin:7px 0 0;color:#dceafb;font-size:.78rem}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;min-height:82px}.stat span,.stat b{display:block}.stat span{font-size:.68rem;color:var(--m);font-weight:850}.stat b{margin-top:8px;color:var(--b);font-size:1.25rem}.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0 10px}.toolbar h2{margin:0;font-size:1rem}.toolbar select{margin-left:auto;min-height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;color:var(--ink)}.list{display:grid;gap:12px}.pay{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 6px 18px #142f4a0c}.pay-head{display:grid;grid-template-columns:1fr auto;gap:10px;padding:15px;border-bottom:1px solid #edf1f6}.pay-head b{display:block;font-size:.88rem}.pay-head span{display:block;margin-top:4px;color:var(--m);font-size:.68rem}.net{text-align:right}.net strong{display:block;color:var(--ok);font-size:1.15rem}.net small{color:var(--m);font-size:.62rem}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 15px}.summary div{padding:9px;border-radius:10px;background:#f8fafc}.summary span,.summary b{display:block}.summary span{font-size:.61rem;color:var(--m);font-weight:850}.summary b{margin-top:4px;font-size:.75rem}.details{display:none;padding:0 15px 15px}.pay.open .details{display:block}.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid var(--line);border-radius:12px;padding:11px}.box h3{margin:0 0 8px;font-size:.78rem;color:var(--b)}.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #e5ebf2;font-size:.68rem}.row:last-child{border-bottom:0}.deductions{margin-top:10px;padding:11px;border-radius:12px;background:#fff8ea;color:#66460e;font-size:.67rem;white-space:pre-wrap;line-height:1.45}.actions{display:flex;gap:8px;padding:0 15px 15px}.actions button{min-height:38px;border-radius:10px;padding:0 12px;font-weight:900}.view{border:1px solid var(--line);background:#fff;color:var(--b)}.print{border:0;background:var(--b);color:#fff}.empty{padding:24px;text-align:center;background:#fff;border:1px dashed #cbd8e5;border-radius:14px;color:var(--m);font-size:.76rem}.embed header{display:none}.embed .wrap{padding-top:12px}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}@media(max-width:560px){.summary{grid-template-columns:1fr 1fr}.breakdown{grid-template-columns:1fr}.pay-head{grid-template-columns:1fr}.net{text-align:left}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button{width:100%}}
@media print{header,.hero,.stats,.toolbar,.actions{display:none!important}.wrap{padding:0}.pay{display:none}.pay.printing{display:block;border:0;box-shadow:none}.pay.printing .details{display:block}.pay.printing .summary{grid-template-columns:repeat(3,1fr)}body{background:#fff}}
</style>
</head>
<body>
<header><img src="assets/TechGeekPH%20-%20logo.png" alt="TechGeekPH"><a class="back" href="app.html">← App Home</a></header>
<main class="wrap">
<section class="hero"><h1>My Payslips</h1><p id="who">Secure payroll records</p></section>
<section class="stats"><div class="stat"><span>PAYSLIPS</span><b id="count">0</b></div><div class="stat"><span>LATEST NET PAY</span><b id="latest">₱0.00</b></div><div class="stat"><span>YTD GROSS</span><b id="gross">₱0.00</b></div><div class="stat"><span>YTD NET</span><b id="net">₱0.00</b></div></section>
<div class="toolbar"><h2>Payroll History</h2><select id="year"><option value="">All years</option></select></div>
<section id="list" class="list"><div class="empty">Loading payslips…</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js?v=20260822-payslips1"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),db=window.TechGeekSupabase;let profile=null,rows=[];if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embed');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'₱'+(Number(v)||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const date=v=>v?new Date(v+'T00:00:00+08:00').toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'}):'—';
function item(r,i){return `<article class="pay" data-i="${i}"><div class="pay-head"><div><b>${esc(r.payroll_label||r.payslip_id)}</b><span>${esc(r.payslip_id)} · ${date(r.period_start)} – ${date(r.period_end)}</span></div><div class="net"><strong>${money(r.net_pay)}</strong><small>Net Pay · ${date(r.salary_date)}</small></div></div><div class="summary"><div><span>GROSS PAY</span><b>${money(r.gross_pay)}</b></div><div><span>DEDUCTIONS</span><b>${money(r.total_deduction)}</b></div><div><span>DAYS PRESENT</span><b>${Number(r.days_present||0)}</b></div><div><span>WORK HOURS</span><b>${Number(r.total_work_hours||0).toFixed(2)}</b></div><div><span>OVERTIME</span><b>${Number(r.overtime_hours||0).toFixed(2)}h</b></div><div><span>AUTO BREAK</span><b>${Number(r.auto_break_hours||0).toFixed(2)}h</b></div></div><div class="details"><div class="breakdown"><div class="box"><h3>Earnings</h3>${[['Base / Basic',Number(r.base_pay||0)+Number(r.basic_salary||0)],['Allowance',r.allowance],['Overtime',r.overtime_pay],['Night Differential',r.night_differential_pay],['Rest Day',r.rest_day_pay],['RDOT',r.rdot_pay],['Holiday',r.holiday_pay],['Additional',r.additional_pay]].map(x=>`<div class="row"><span>${x[0]}</span><b>${money(x[1])}</b></div>`).join('')}<div class="row"><span>Gross Pay</span><b>${money(r.gross_pay)}</b></div></div><div class="box"><h3>Deductions</h3>${[['Cash Advance',r.cash_advance_deduction],['Loan',r.loan_deduction],['SSS',r.sss_deduction],['PhilHealth',r.philhealth_deduction],['Pag-IBIG',r.pagibig_deduction],['Other',r.other_deduction]].map(x=>`<div class="row"><span>${x[0]}</span><b>${money(x[1])}</b></div>`).join('')}<div class="row"><span>Total Deductions</span><b>${money(r.total_deduction)}</b></div><div class="row"><span>Net Pay</span><b>${money(r.net_pay)}</b></div></div></div>${r.deduction_details?`<div class="deductions"><b>Deduction details</b>\n${esc(r.deduction_details)}</div>`:''}${r.remarks?`<div class="deductions"><b>Remarks</b>\n${esc(r.remarks)}</div>`:''}</div><div class="actions"><button class="view" type="button" data-view="${i}">View Details</button><button class="print" type="button" data-print="${i}">Print / Save PDF</button></div></article>`}
function render(){const y=$('year').value;const list=rows.filter(r=>!y||String(r.salary_date||r.period_end||'').startsWith(y));$('list').innerHTML=list.length?list.map((r,i)=>item(r,i)).join(''):'<div class="empty">No payslips found.</div>';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const p=b.closest('.pay');p.classList.toggle('open');b.textContent=p.classList.contains('open')?'Hide Details':'View Details'});document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>{const p=b.closest('.pay');document.querySelectorAll('.pay').forEach(x=>x.classList.remove('printing'));p.classList.add('printing','open');window.print();setTimeout(()=>p.classList.remove('printing'),500)})}
async function boot(){if(!db){location.replace('app.html');return}const s=(await db.auth.getSession()).data.session;if(!s){location.replace('app.html');return}const p=await db.from('staff_profiles').select('full_name,role,active,employee_id').eq('user_id',s.user.id).maybeSingle();if(p.error||!p.data||!p.data.active||p.data.role!=='EMPLOYEE'){location.replace('app.html');return}profile=p.data;$('who').textContent=profile.full_name+' · '+profile.employee_id;const q=await db.from('app_payslips').select('*').order('salary_date',{ascending:false}).order('generated_at',{ascending:false});if(q.error){$('list').innerHTML='<div class="empty">'+esc(q.error.message)+'</div>';return}rows=q.data||[];$('count').textContent=rows.length;$('latest').textContent=rows.length?money(rows[0].net_pay):money(0);const yr=new Date().getFullYear();$('gross').textContent=money(rows.filter(r=>String(r.salary_date||'').startsWith(String(yr))).reduce((s,r)=>s+Number(r.gross_pay||0),0));$('net').textContent=money(rows.filter(r=>String(r.salary_date||'').startsWith(String(yr))).reduce((s,r)=>s+Number(r.net_pay||0),0));const years=[...new Set(rows.map(r=>String(r.salary_date||r.period_end||'').slice(0,4)).filter(Boolean))];$('year').innerHTML='<option value="">All years</option>'+years.map(y=>`<option>${esc(y)}</option>`).join('');$('year').onchange=render;render()}
boot();})();
</script>
</body>
</html>
