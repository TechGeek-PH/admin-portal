<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#064f83"><title>TechGeekPH Payroll</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fa;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17355d}.box{text-align:center;padding:28px}.logo{width:min(250px,70vw)}.spin{width:36px;height:36px;margin:20px auto;border:4px solid #dbe7f2;border-top-color:#064f83;border-radius:50%;animation:r .75s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="box"><img class="logo" src="assets/TechGeekPH%20-%20logo.png" alt="TechGeekPH"><div class="spin"></div><b>Opening secure payroll…</b></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/supabase-config.js?v=20260822-payrollroute1"></script><script>(async()=>{try{const db=window.TechGeekSupabase;if(!db)throw new Error('Supabase unavailable');const s=(await db.auth.getSession()).data.session;if(!s){location.replace('app.html');return}const p=await db.from('staff_profiles').select('role,active').eq('user_id',s.user.id).maybeSingle();if(p.error||!p.data||!p.data.active){location.replace('app.html');return}const q=new URLSearchParams(location.search);const suffix=q.get('embed')==='1'?'?embed=1&source=app-embed':'';location.replace(p.data.role==='EMPLOYEE'?'app-payslips.html'+suffix:'app-payroll-admin.html'+suffix)}catch(e){location.replace('app.html')}})();</script></body></html>
